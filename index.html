<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Control de Almacén — Obras</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  :root{
    --bg:#F2EFE8;
    --surface:#FFFFFF;
    --surface-alt:#EAE5D9;
    --ink:#22231F;
    --ink-soft:#6B6A61;
    --border:#DCD5C4;
    --accent-in:#2E7D4F;
    --accent-in-soft:#DCEFE0;
    --accent-out:#D9631E;
    --accent-out-soft:#FBE4D3;
    --warn:#C0392B;
    --warn-soft:#F7D9D4;
    --radius:12px;
    --font-display:'Oswald',system-ui,sans-serif;
    --font-body:'Inter',system-ui,-apple-system,sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:var(--font-body);
    -webkit-font-smoothing:antialiased;
    padding-bottom:calc(78px + env(safe-area-inset-bottom));
  }
  #app{
    max-width:520px;
    margin:0 auto;
    min-height:100vh;
    padding:16px 16px 8px;
  }
  header.topbar{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    padding:6px 2px 16px;
    border-bottom:3px solid var(--ink);
    margin-bottom:18px;
  }
  header.topbar h1{
    font-family:var(--font-display);
    font-size:20px;
    letter-spacing:0.02em;
    text-transform:uppercase;
    margin:0;
  }
  header.topbar .sub{
    font-size:11px;
    color:var(--ink-soft);
    font-weight:600;
    text-transform:uppercase;
    letter-spacing:0.06em;
  }
  h2.section-title{
    font-family:var(--font-display);
    font-size:15px;
    text-transform:uppercase;
    letter-spacing:0.04em;
    color:var(--ink);
    margin:0 0 12px;
    display:flex;
    align-items:center;
    gap:8px;
  }
  h2.section-title::before{
    content:"";
    width:6px;height:18px;
    background:var(--accent-out);
    display:inline-block;
  }
  .card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:16px;
    margin-bottom:12px;
  }
  .seg{
    display:flex;
    border:2px solid var(--ink);
    border-radius:10px;
    overflow:hidden;
    margin-bottom:14px;
  }
  .seg button{
    flex:1;
    padding:12px 8px;
    border:none;
    background:var(--surface);
    font-family:var(--font-display);
    font-size:14px;
    letter-spacing:0.03em;
    text-transform:uppercase;
    font-weight:600;
    color:var(--ink);
    cursor:pointer;
  }
  .seg button.active.entrada{background:var(--accent-in);color:#fff;}
  .seg button.active.salida{background:var(--accent-out);color:#fff;}
  label{
    display:block;
    font-size:11px;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:0.05em;
    color:var(--ink-soft);
    margin-bottom:6px;
  }
  .field{margin-bottom:14px;}
  .two-col{display:block;}
  .two-col .col{min-width:0;}
  select, input[type=text], input[type=number]{
    width:100%;
    padding:12px 12px;
    border:1.5px solid var(--border);
    border-radius:8px;
    font-size:15px;
    font-family:var(--font-body);
    background:var(--surface);
    color:var(--ink);
  }
  select:focus, input:focus{outline:2px solid var(--ink);outline-offset:1px;}
  .btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    padding:13px 16px;
    border-radius:9px;
    border:2px solid var(--ink);
    background:var(--surface);
    font-family:var(--font-display);
    font-weight:600;
    font-size:14px;
    text-transform:uppercase;
    letter-spacing:0.03em;
    cursor:pointer;
    width:100%;
  }
  .btn.primary{background:var(--ink);color:#fff;}
  .btn.in{background:var(--accent-in);border-color:var(--accent-in);color:#fff;}
  .btn.out{background:var(--accent-out);border-color:var(--accent-out);color:#fff;}
  .btn.ghost{background:transparent;}
  .btn.small{padding:8px 10px;font-size:11px;width:auto;}
  .btn:disabled{opacity:0.4;cursor:not-allowed;}
  .btn-row{display:flex;gap:8px;}
  .scan-target{
    border:2px dashed var(--border);
    border-radius:var(--radius);
    padding:16px;
    text-align:center;
    margin-bottom:14px;
  }
  .scan-target.filled{
    border-style:solid;
    border-color:var(--ink);
    text-align:left;
  }
  .scan-target .code{
    font-family:var(--font-display);
    font-weight:600;
    font-size:13px;
    color:var(--ink-soft);
    text-transform:uppercase;
  }
  .scan-target .name{font-size:16px;font-weight:600;margin-top:2px;}
  .stepper{display:flex;align-items:center;gap:10px;}
  .stepper button{
    width:44px;height:44px;
    border-radius:8px;
    border:2px solid var(--ink);
    background:var(--surface);
    font-size:20px;
    font-weight:700;
    cursor:pointer;
  }
  .stepper input{text-align:center;font-weight:700;font-size:18px;}
  .tabbar{
    position:fixed;
    bottom:0;left:0;right:0;
    background:var(--surface);
    border-top:2px solid var(--ink);
    display:flex;
    padding:8px calc(env(safe-area-inset-bottom) + 4px) calc(6px + env(safe-area-inset-bottom));
    z-index:40;
  }
  .tabbar button{
    flex:1;
    background:none;
    border:none;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:3px;
    padding:6px 2px;
    color:var(--ink-soft);
    font-family:var(--font-body);
    font-size:10px;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:0.02em;
    cursor:pointer;
  }
  .tabbar button.active{color:var(--ink);}
  .tabbar button.active svg{stroke:var(--accent-out);}
  .tabbar svg{width:22px;height:22px;stroke:var(--ink-soft);fill:none;stroke-width:2;}
  .badge{
    display:inline-block;
    padding:2px 8px;
    border-radius:20px;
    font-size:10px;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:0.03em;
  }
  .badge.in{background:var(--accent-in-soft);color:var(--accent-in);}
  .badge.out{background:var(--accent-out-soft);color:var(--accent-out);}
  .badge.warn{background:var(--warn-soft);color:var(--warn);}
  .badge.example{background:var(--surface-alt);color:var(--ink-soft);}
  .list-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:12px 0;
    border-bottom:1px solid var(--border);
    gap:10px;
  }
  .list-row:last-child{border-bottom:none;}
  .list-row .main{flex:1;min-width:0;}
  .list-row .main .t1{font-weight:600;font-size:14.5px;}
  .list-row .main .t2{font-size:12px;color:var(--ink-soft);margin-top:2px;}
  .list-row .num{font-family:var(--font-display);font-size:20px;font-weight:600;}
  .subtabs{display:flex;gap:6px;margin-bottom:14px;}
  .subtabs button{
    flex:1;padding:9px;border-radius:8px;border:1.5px solid var(--border);
    background:var(--surface);font-weight:600;font-size:12.5px;cursor:pointer;
    text-transform:uppercase;letter-spacing:0.02em;
  }
  .subtabs button.active{background:var(--ink);color:#fff;border-color:var(--ink);}
  .searchbox{margin-bottom:14px;}
  .empty{
    text-align:center;padding:28px 12px;color:var(--ink-soft);font-size:13.5px;
  }
  .icon-btn{
    background:none;border:none;cursor:pointer;padding:6px;
    color:var(--ink-soft);
  }
  .toast{
    position:fixed;left:50%;bottom:100px;transform:translateX(-50%) translateY(20px);
    background:var(--ink);color:#fff;padding:11px 20px;border-radius:30px;
    font-size:13.5px;font-weight:600;opacity:0;transition:all .25s ease;
    z-index:100;pointer-events:none;white-space:nowrap;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  .modal-overlay{
    position:fixed;inset:0;background:rgba(20,20,18,0.9);
    z-index:80;display:flex;flex-direction:column;
    align-items:center;justify-content:center;padding:20px;
  }
  .scan-frame{
    position:relative;width:100%;max-width:340px;aspect-ratio:1/1;
    border-radius:16px;overflow:hidden;background:#000;
  }
  .scan-frame video{width:100%;height:100%;object-fit:cover;}
  .scan-corner{
    position:absolute;width:36px;height:36px;border-color:var(--accent-out);
    pointer-events:none;
  }
  .scan-corner.tl{top:10px;left:10px;border-top:4px solid var(--accent-out);border-left:4px solid var(--accent-out);border-radius:6px 0 0 0;}
  .scan-corner.tr{top:10px;right:10px;border-top:4px solid var(--accent-out);border-right:4px solid var(--accent-out);border-radius:0 6px 0 0;}
  .scan-corner.bl{bottom:10px;left:10px;border-bottom:4px solid var(--accent-out);border-left:4px solid var(--accent-out);border-radius:0 0 0 6px;}
  .scan-corner.br{bottom:10px;right:10px;border-bottom:4px solid var(--accent-out);border-right:4px solid var(--accent-out);border-radius:0 0 6px 0;}
  .scan-hint{color:#fff;text-align:center;margin-top:18px;font-size:13.5px;opacity:0.85;}
  .modal-actions{margin-top:22px;width:100%;max-width:340px;display:flex;flex-direction:column;gap:10px;}
  .modal-actions .btn.ghost{border-color:#fff;color:#fff;}
  dialog.formsheet{
    border:none;border-radius:16px 16px 0 0;padding:0;width:100%;max-width:520px;
    margin:auto auto 0;
  }
  dialog.formsheet::backdrop{background:rgba(20,20,18,0.55);}
  .sheet-inner{padding:18px 18px calc(20px + env(safe-area-inset-bottom));max-height:80vh;overflow-y:auto;}
  .sheet-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;}
  .sheet-head h3{font-family:var(--font-display);text-transform:uppercase;font-size:15px;margin:0;}
  #label-print-content{display:none;}
  #lockScreen{
    position:fixed;inset:0;background:var(--ink);z-index:200;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:24px;
  }
  #lockScreen .lock-card{width:100%;max-width:300px;text-align:center;}
  #lockScreen h1{
    font-family:var(--font-display);color:#fff;text-transform:uppercase;
    font-size:19px;letter-spacing:0.03em;margin:0 0 4px;
  }
  #lockScreen p{color:#B9B7AC;font-size:12.5px;margin:0 0 26px;}
  #lockScreen input{
    width:100%;text-align:center;font-size:26px;letter-spacing:0.5em;
    padding:14px 10px 14px 16px;border-radius:9px;border:2px solid #45463E;
    background:#2C2D27;color:#fff;font-family:var(--font-display);
  }
  #lockScreen input:focus{outline:2px solid var(--accent-out);border-color:var(--accent-out);}
  #lockScreen .btn{margin-top:14px;background:var(--accent-out);border-color:var(--accent-out);color:#fff;}
  #lockScreen .err{color:#F0A98A;font-size:12px;margin-top:10px;min-height:16px;}

  /* ---- Desktop / web layout ---- */
  @media (min-width:860px){
    body{ padding-bottom:0; padding-top:66px; }
    #app{ max-width:960px; padding:0 32px 48px; }
    header.topbar{ padding-top:22px; }
    .tabbar{
      top:0; bottom:auto;
      border-top:none; border-bottom:2px solid var(--ink);
      justify-content:center; gap:4px;
      padding:10px calc(env(safe-area-inset-bottom) + 4px);
    }
    .tabbar button{ flex:0 0 auto; flex-direction:row; gap:7px; padding:9px 20px; font-size:12px; }
    .tabbar svg{ width:18px; height:18px; }
    .card{ padding:26px 28px; max-width:760px; margin-left:auto; margin-right:auto; }
    #tab-content > .card:first-child{ margin-left:auto; margin-right:auto; }
    .list-row{ padding:14px 2px; }
    .two-col{ display:grid; grid-template-columns:1fr 1fr; gap:0 24px; align-items:start; }
    dialog.formsheet{
      border-radius:16px; margin:auto; max-width:480px;
      max-height:85vh;
    }
    .sheet-inner{ max-height:85vh; }
  }
  @media (min-width:860px) and (min-height:1){
    /* Historial / Catálogo benefit from a wider reading column than the form cards */
    #tab-content .card:has(#histList),
    #tab-content .card:has(#matList),
    #tab-content .card:has(#obraList),
    #tab-content .card:has(#respList){ max-width:760px; }
  }
  @media print{
    #app,.tabbar,.toast{display:none !important;}
    #label-print-content{
      display:flex !important;align-items:center;gap:16px;
      position:fixed;top:30px;left:30px;
    }
    .label-text{font-family:sans-serif;font-size:16px;line-height:1.4;}
  }
</style>
</head>
<body>
<div id="lockScreen">
  <div class="lock-card">
    <h1>Control de Almacén</h1>
    <p>Introduce el código de acceso</p>
    <input type="tel" inputmode="numeric" maxlength="4" id="lockInput" autocomplete="off" placeholder="••••">
    <button class="btn" id="lockBtn">Entrar</button>
    <div class="err" id="lockErr"></div>
  </div>
</div>
<div id="app"></div>
<div id="toast" class="toast"></div>
<div id="label-print-content"></div>
<dialog id="formsheet" class="formsheet"><div class="sheet-inner" id="sheet-inner-content"></div></dialog>

<script>
/* ---------------- STATE ---------------- */
const state = { materiales: [], obras: [], responsables: [], movimientos: [], tab: 'escanear', catalogSub: 'materiales', loaded:false };
const formState = { tipo:'Salida', obraCodigo:null, obraLibre:'', obraDetalle:'', lineas:[], responsableCodigo:null, nota:'' };
let scanning = false, scanMode = null, stream = null, rafId = null, detector = null, audioCtx = null;

const seedMateriales = [{codigo:'MAT-001', descripcion:'Cemento gris 25kg', unidad:'sacos', codigoProveedor:'', codigoPropio:'', ejemplo:true}];
const seedObras = [{codigo:'OBR-001', nombre:'Reforma Calle Mayor 12', responsable:'Encargado', estado:'Activa', ejemplo:true}];
const seedResponsables = [{codigo:'RESP-001', nombre:'Encargado de almacén', ejemplo:true}];

/* ---------------- STORAGE (JSONBin.io) ---------------- */
// 1) Crea una cuenta gratuita en https://jsonbin.io
// 2) Copia tu API Key en https://jsonbin.io/api-keys y pégala abajo en JSONBIN_API_KEY
// 3) Crea un Bin nuevo con este contenido inicial y pega su ID en JSONBIN_BIN_ID:
//    {"materiales":[{"codigo":"MAT-001","descripcion":"Cemento gris 25kg","unidad":"sacos","codigoProveedor":"","codigoPropio":"","ejemplo":true}],"obras":[{"codigo":"OBR-001","nombre":"Reforma Calle Mayor 12","responsable":"Encargado","estado":"Activa","ejemplo":true}],"responsables":[{"codigo":"RESP-001","nombre":"Encargado de almacén","ejemplo":true}],"movimientos":[]}
const JSONBIN_API_KEY = '$2a$10$5DKABYP8CsU.TCkAeSesNOwMQaCRfbMhtwPa4Cd5R2nZBJbhSR8NC';
const JSONBIN_BIN_ID  = '6a7afae3f5f4af5e2906a31b';
const JSONBIN_URL = 'https://api.jsonbin.io/v3/b/' + JSONBIN_BIN_ID;

function jsonbinConfigured(){
  return JSONBIN_API_KEY && !JSONBIN_API_KEY.includes('PASTE') && JSONBIN_BIN_ID && !JSONBIN_BIN_ID.includes('PASTE');
}
async function loadAll(){
  try{
    const res = await fetch(JSONBIN_URL + '/latest', { headers:{ 'X-Master-Key': JSONBIN_API_KEY } });
    if(!res.ok) throw new Error('HTTP '+res.status);
    const data = await res.json();
    const record = data.record || {};
    state.materiales = record.materiales || seedMateriales;
    state.obras = record.obras || seedObras;
    state.responsables = record.responsables || seedResponsables;
    state.movimientos = record.movimientos || [];
  }catch(e){
    console.error('load error', e);
    toast('No se pudo cargar el almacenamiento (revisa conexión o configuración)');
    if(!state.loaded){ state.materiales = seedMateriales; state.obras = seedObras; state.responsables = seedResponsables; state.movimientos = []; }
  }
  state.loaded = true;
}
async function saveAll(){
  try{
    const res = await fetch(JSONBIN_URL, {
      method:'PUT',
      headers:{ 'Content-Type':'application/json', 'X-Master-Key': JSONBIN_API_KEY },
      body: JSON.stringify({ materiales: state.materiales, obras: state.obras, responsables: state.responsables, movimientos: state.movimientos })
    });
    if(!res.ok) throw new Error('HTTP '+res.status);
  }catch(e){
    console.error('save error', e);
    toast('No se pudo guardar (revisa conexión o configuración)');
  }
}

/* ---------------- HELPERS ---------------- */
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(window.__toastTimer);
  window.__toastTimer = setTimeout(()=>t.classList.remove('show'), 2200);
}
function nextCodigo(prefix, arr){
  let max=0;
  arr.forEach(x=>{
    const m=/-(\d+)$/.exec(x.codigo);
    if(m) max = Math.max(max, parseInt(m[1],10));
  });
  return prefix+'-'+String(max+1).padStart(3,'0');
}
function findMaterial(codigo){ return state.materiales.find(m=>m.codigo===codigo); }
function findObra(codigo){ return state.obras.find(o=>o.codigo===codigo); }
function findResponsable(codigo){ return state.responsables.find(r=>r.codigo===codigo); }
function fmtDate(iso){
  const d = new Date(iso);
  return d.toLocaleDateString('es-ES',{day:'2-digit',month:'2-digit',year:'2-digit'}) + ' ' + d.toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'});
}
function todayCount(){
  const today = new Date().toDateString();
  return state.movimientos.filter(m=> new Date(m.fecha).toDateString()===today).length;
}
function escapeHtml(s){ return (s||'').replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function unlockAudio(){
  try{
    if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if(audioCtx.state === 'suspended') audioCtx.resume();
    // iOS Safari needs a real sound played synchronously within the tap to fully unlock audio
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.frequency.value = 440;
    gain.gain.setValueAtTime(0.00001, audioCtx.currentTime);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(audioCtx.currentTime);
    osc.stop(audioCtx.currentTime + 0.05);
  }catch(e){ console.error('unlock audio error', e); }
}
function playBeep(){
  try{
    if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if(audioCtx.state === 'suspended') audioCtx.resume();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.value = 1046.5;
    gain.gain.setValueAtTime(0.0001, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.35, audioCtx.currentTime + 0.01);
    gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.16);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.17);
  }catch(e){ console.error('beep error', e); }
  if(navigator.vibrate){ try{ navigator.vibrate(60); }catch(e){} }
}

/* ---------------- ICONS ---------------- */
const ICONS = {
  scan:'<svg viewBox="0 0 24 24"><path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2" stroke-linecap="round"/><rect x="7" y="7" width="10" height="10" rx="1"/></svg>',

function wireLineasEvents(c){
  const list = c.querySelector('#lineasList');
  if(!list) return;
  list.querySelectorAll('[data-lqty]').forEach(inp=>{
    inp.addEventListener('focus', e=> e.target.select());
    inp.addEventListener('input', e=>{
      const i = Number(e.target.dataset.lqty);
      formState.lineas[i].cantidad = e.target.value;
      const btn = document.getElementById('guardarBtn');
      if(btn){
        const tieneObra = !!(formState.obraCodigo || (formState.obraLibre && formState.obraLibre.trim()));
        const tieneLineas = formState.lineas.length>0 && formState.lineas.every(l=>Number(l.cantidad)>0);
        btn.disabled = !tieneLineas || !tieneObra;
      }
    });
  });
  list.querySelectorAll('[data-lminus]').forEach(b=>b.addEventListener('click', ()=>{
    const i = Number(b.dataset.lminus);
    formState.lineas[i].cantidad = Math.max(0,(Number(formState.lineas[i].cantidad)||0)-1);
    render();
  }));
  list.querySelectorAll('[data-lplus]').forEach(b=>b.addEventListener('click', ()=>{
    const i = Number(b.dataset.lplus);
    formState.lineas[i].cantidad = (Number(formState.lineas[i].cantidad)||0)+1;
    render();
  }));
  list.querySelectorAll('[data-lremove]').forEach(b=>b.addEventListener('click', ()=>{
    const i = Number(b.dataset.lremove);
    formState.lineas.splice(i,1);
    render();
  }));
}
function addMaterialALineas(codigoMaterial){
  const existente = formState.lineas.find(l=>l.materialCodigo===codigoMaterial);
  if(existente){ existente.cantidad = (Number(existente.cantidad)||0)+1; }
  else { formState.lineas.push({materialCodigo: codigoMaterial, cantidad: 1}); }
}
async function guardarMovimiento(){
  const tieneObra = !!(formState.obraCodigo || (formState.obraLibre && formState.obraLibre.trim()));
  const lineasValidas = formState.lineas.filter(l=>Number(l.cantidad)>0);
  if(!tieneObra || lineasValidas.length===0){
    toast('Faltan datos por completar'); return;
  }
  const fecha = new Date().toISOString();
  lineasValidas.forEach(l=>{
    state.movimientos.push({
      id: 'M'+Date.now()+Math.floor(Math.random()*10000),
      fecha,
      tipo: formState.tipo,
      codigoMaterial: l.materialCodigo,
      cantidad: Number(l.cantidad),
      codigoObra: formState.obraCodigo || null,
      obraLibre: formState.obraCodigo ? '' : (formState.obraLibre || '').trim(),
      obraDetalle: formState.obraCodigo ? '' : (formState.obraDetalle || '').trim(),
      responsableCodigo: formState.responsableCodigo || null,
      nota: formState.nota || ''
    });
  });
  await saveAll();
  toast((formState.tipo==='Entrada'?'Entrada guardada ✓':'Salida guardada ✓')+' ('+lineasValidas.length+' material'+(lineasValidas.length===1?'':'es')+')');

/* ---------------- SCANNING ---------------- */
function openScan(mode){
  scanMode = mode;
  unlockAudio();
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.id = 'scanOverlay';
  overlay.innerHTML = `
    <div class="scan-frame">
      <video id="scanVideo" autoplay playsinline muted></video>
      <div class="scan-corner tl"></div><div class="scan-corner tr"></div>
      <div class="scan-corner bl"></div><div class="scan-corner br"></div>
    </div>
    <div class="scan-hint">Enfoca el código QR o de barras del material</div>
    <div class="modal-actions">
      <button class="btn ghost" id="manualEntryBtn">Introducir código manualmente</button>
      <button class="btn ghost" id="cancelScanBtn">Cancelar</button>
    </div>
  `;
  document.body.appendChild(overlay);
  overlay.querySelector('#cancelScanBtn').addEventListener('click', closeScan);
  overlay.querySelector('#manualEntryBtn').addEventListener('click', ()=>{
    const val = prompt('Introduce el código:');
    closeScan();
    if(val) onScanResult(val.trim());
  });
  startCamera();
}
async function startCamera(){
  const video = document.getElementById('scanVideo');
  try{
    stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});
    video.srcObject = stream;
    await video.play();
    scanning = true;
    detectLoop(video);
  }catch(e){
    toast('No se pudo acceder a la cámara');
    closeScan();
  }
}
let scanCanvas = null;
function detectLoop(video){
  if(!scanning) return;
  if('BarcodeDetector' in window){
    if(!detector){
      try{ detector = new BarcodeDetector({formats:['qr_code','ean_13','ean_8','upc_a','upc_e','code_128','code_39']}); }
      catch(e){ detector = new BarcodeDetector(); }
    }
    detector.detect(video).then(codes=>{
      if(codes && codes.length>0){ const v=codes[0].rawValue; closeScan(); onScanResult(v); }
      else { rafId = requestAnimationFrame(()=>detectLoop(video)); }
    }).catch(()=>{ rafId = requestAnimationFrame(()=>detectLoop(video)); });
  } else if(typeof jsQR === 'function'){
    if(!scanCanvas) scanCanvas = document.createElement('canvas');
    const w = video.videoWidth, h = video.videoHeight;
    if(w && h){
      scanCanvas.width = w; scanCanvas.height = h;
      const ctx = scanCanvas.getContext('2d');
      ctx.drawImage(video,0,0,w,h);
      const imgData = ctx.getImageData(0,0,w,h);
      const code = jsQR(imgData.data, w, h);
      if(code && code.data){ const v=code.data; closeScan(); onScanResult(v); return; }
    }
    rafId = requestAnimationFrame(()=>detectLoop(video));
  } else {
    rafId = requestAnimationFrame(()=>detectLoop(video));
  }
}
function closeScan(){
  scanning = false;
  if(rafId) cancelAnimationFrame(rafId);
  if(stream){ stream.getTracks().forEach(t=>t.stop()); stream=null; }
  const overlay = document.getElementById('scanOverlay');
  if(overlay) overlay.remove();
}
function onScanResult(value){
  playBeep();
  const mat = findMaterial(value);
  if(mat){
    addMaterialALineas(mat.codigo);
    toast('Añadido: '+mat.descripcion);
    render();
  } else {
    if(confirm('Código no reconocido: "'+value+'".\n¿Quieres darlo de alta como material nuevo?')){
      state.tab = 'catalogo'; state.catalogSub = 'materiales'; render();
      openMaterialForm(null, value);
    }
  }
}

}
function openObraResumen(obra){
  if(!obra) return;
  const inner = document.getElementById('sheet-inner-content');
  const mapa = {};
  state.movimientos.forEach(m=>{
    if(m.codigoObra !== obra.codigo) return;
    if(!mapa[m.codigoMaterial]) mapa[m.codigoMaterial] = {salida:0, entrada:0};
    if(m.tipo==='Salida') mapa[m.codigoMaterial].salida += Number(m.cantidad)||0;
    else mapa[m.codigoMaterial].entrada += Number(m.cantidad)||0;
  });
  const filas = Object.keys(mapa).map(codigo=>{
    const mat = findMaterial(codigo);
    const {salida, entrada} = mapa[codigo];
    return {
      codigo,
      nombre: mat ? mat.descripcion : codigo,
      unidad: mat ? mat.unidad : '',
      salida, entrada,
      neto: salida - entrada
    };
  }).sort((a,b)=>a.nombre.localeCompare(b.nombre));
  const totalMovs = state.movimientos.filter(m=>m.codigoObra===obra.codigo).length;

  inner.innerHTML = `
    <div class="sheet-head"><h3>Resumen — ${escapeHtml(obra.nombre)}</h3><button class="icon-btn" id="closeSheet">✕</button></div>
    <p style="font-size:12.5px;color:var(--ink-soft);margin-top:-6px;">Material llevado a esta obra (salidas menos entradas/devoluciones). ${totalMovs} movimiento${totalMovs===1?'':'s'} registrado${totalMovs===1?'':'s'}.</p>
    ${filas.length ? filas.map(f=>`
      <div class="list-row">
        <div class="main">
          <div class="t1">${escapeHtml(f.nombre)}</div>
          <div class="t2">${f.codigo} · salidas ${f.salida} · entradas ${f.entrada}</div>
        </div>
        <div class="num">${f.neto}<span style="font-size:11px;color:var(--ink-soft);font-family:var(--font-body);"> ${f.unidad}</span></div>
      </div>
    `).join('') : `<div class="empty">Todavía no hay movimientos registrados para esta obra.</div>`}
  `;
  inner.querySelector('#closeSheet').addEventListener('click', ()=>document.getElementById('formsheet').close());
  document.getElementById('formsheet').showModal();
}

/* ---------------- LABEL PRINTING ---------------- */
function imprimirEtiqueta(tipo, item){
  if(!item) return;
  const cont = document.getElementById('label-print-content');
  cont.innerHTML = '';
  const qrDiv = document.createElement('div');
  cont.appendChild(qrDiv);
  const text = document.createElement('div');
  text.className = 'label-text';
  text.innerHTML = `<strong>${item.codigo}</strong><br>${escapeHtml(tipo==='material'?item.descripcion:item.nombre)}`;
  cont.appendChild(text);
  try{
    if(typeof QRCode === 'function'){ new QRCode(qrDiv, {text:item.codigo, width:160, height:160}); }
    else { qrDiv.textContent = '(QR no disponible, usa el código: '+item.codigo+')'; }
  }catch(e){ qrDiv.textContent = 'Código: '+item.codigo; }
  setTimeout(()=>window.print(), 250);
}

/* ---------------- TAB: HISTORIAL ---------------- */
function renderHistorial(c){
  c.innerHTML = `
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;">
        <h2 class="section-title">Historial de movimientos</h2>
        <button class="btn ghost small" id="refreshHistBtn">↻ Actualizar</button>
      </div>
      <div class="two-col">
        <div class="col">
          <label>Estado de la obra</label>
          <div class="field">
            <select id="filtEstado">
              <option value="activas">Solo obras activas</option>
              <option value="todas">Todas</option>
              <option value="cerradas">Solo cerradas</option>
            </select>
          </div>
        </div>
        <div class="col">
          <label>Obra</label>
          <div class="field">
            <select id="filtObra">
              <option value="">Todas las obras</option>
              ${state.obras.map(o=>`<option value="${o.codigo}">${escapeHtml(o.nombre)}${o.estado==='Cerrada'?' (cerrada)':''}</option>`).join('')}
            </select>
          </div>
        </div>
      </div>
      <div class="field">
        <select id="filtTipo">
          <option value="">Entradas y salidas</option>
          <option value="Entrada">Solo entradas</option>
          <option value="Salida">Solo salidas</option>
        </select>
      </div>
      <div id="histList"></div>
    </div>
  `;
  function obraLabel(m){
    if(m.codigoObra){ const o = findObra(m.codigoObra); return o ? o.nombre : m.codigoObra; }
    if(m.obraLibre) return m.obraLibre + (m.obraDetalle ? ': '+m.obraDetalle : '');
    return '—';
  }
  function obraEstado(m){
    if(!m.codigoObra) return null;
    const o = findObra(m.codigoObra);
    return o ? o.estado : null;
  }
  function draw(){
    const fo = c.querySelector('#filtObra').value;
    const ft = c.querySelector('#filtTipo').value;
    const fe = c.querySelector('#filtEstado').value;
    let list = [...state.movimientos].filter(m=> (!fo||m.codigoObra===fo) && (!ft||m.tipo===ft) );
    if(fe==='activas') list = list.filter(m=> obraEstado(m) !== 'Cerrada');
    else if(fe==='cerradas') list = list.filter(m=> obraEstado(m) === 'Cerrada');
    list.sort((a,b)=> new Date(b.fecha) - new Date(a.fecha));
    document.getElementById('histList').innerHTML = list.length ? list.map(m=>{
      const mat = findMaterial(m.codigoMaterial);
      const resp = m.responsableCodigo ? findResponsable(m.responsableCodigo) : null;
      const detalles = [obraLabel(m)];
      if(resp) detalles.push('Resp: '+escapeHtml(resp.nombre));
      const codigos = [];
      if(mat && mat.codigoProveedor) codigos.push(`Prov: <span class="code-copy" data-copy="${escapeHtml(mat.codigoProveedor)}" title="Tocar para copiar" style="text-decoration:underline dotted;cursor:pointer;">${escapeHtml(mat.codigoProveedor)}</span>`);
      if(mat && mat.codigoPropio) codigos.push('Propio: '+escapeHtml(mat.codigoPropio));
      return `
      <div class="list-row">
        <div class="main">
          <div class="t1"><span class="badge ${m.tipo==='Entrada'?'in':'out'}">${m.tipo}</span> ${escapeHtml(mat?mat.descripcion:m.codigoMaterial)}</div>
          <div class="t2">${fmtDate(m.fecha)} · ${detalles.join(' · ')}</div>
          ${codigos.length ? `<div class="t2" style="margin-top:2px;">${codigos.join(' · ')}</div>` : ''}
        </div>
        <div style="display:flex;align-items:center;gap:10px;">
          <div class="num">${m.cantidad}</div>
          <button class="icon-btn" data-editmov="${m.id}" title="Editar">✎</button>
        </div>
      </div>`;
    }).join('') : `<div class="empty">No hay movimientos con estos filtros.</div>`;
    document.querySelectorAll('[data-editmov]').forEach(b=>b.addEventListener('click', ()=>{
      const mov = state.movimientos.find(x=>x.id===b.dataset.editmov);
      if(mov) openEditMovimientoForm(mov);
    }));
    document.querySelectorAll('[data-copy]').forEach(el=>el.addEventListener('click', ()=>{
      const val = el.dataset.copy;
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(val).then(()=>toast('Copiado ✓')).catch(()=>toast('No se pudo copiar'));
      } else {
        toast('Copiar no está disponible en este navegador');
      }
    }));
  }
  draw();
  c.querySelector('#filtEstado').addEventListener('change', draw);
  c.querySelector('#filtObra').addEventListener('change', draw);
  c.querySelector('#filtTipo').addEventListener('change', draw);
  c.querySelector('#refreshHistBtn').addEventListener('click', refreshData);
}
function openEditMovimientoForm(mov){
  const inner = document.getElementById('sheet-inner-content');
  inner.innerHTML = `
    <div class="sheet-head"><h3>Editar movimiento</h3><button class="icon-btn" id="closeSheet">✕</button></div>
    <label>Tipo</label>
    <div class="field">
      <select id="e_tipo">
        <option value="Salida" ${mov.tipo==='Salida'?'selected':''}>Salida</option>
        <option value="Entrada" ${mov.tipo==='Entrada'?'selected':''}>Entrada</option>
      </select>
    </div>
    <label>Obra</label>
    <div class="field">
      <select id="e_obra">
        <option value="">— Selecciona una obra —</option>
        ${state.obras.map(o=>`<option value="${o.codigo}" ${o.codigo===mov.codigoObra?'selected':''}>${escapeHtml(o.nombre)}</option>`).join('')}
        <option value="__OPERARIO__" ${mov.obraLibre==='Operario'?'selected':''}>Operario</option>
        <option value="__OTROS__" ${mov.obraLibre==='Otros'?'selected':''}>Otros</option>
      </select>
    </div>
    <label>Nombre del operario / detalle (si aplica)</label>
    <div class="field"><input type="text" id="e_obraDetalle" value="${escapeHtml(mov.obraDetalle||'')}"></div>
    <label>Material</label>
    <div class="field">
      <select id="e_material">
        ${state.materiales.map(m=>`<option value="${m.codigo}" ${m.codigo===mov.codigoMaterial?'selected':''}>${escapeHtml(m.descripcion)} (${m.codigo})</option>`).join('')}
      </select>
    </div>
    <label>Cantidad</label>
    <div class="field"><input type="number" id="e_cantidad" min="0" value="${mov.cantidad}"></div>
    <label>Responsable</label>
    <div class="field">
      <select id="e_responsable">
        <option value="">— Sin responsable —</option>
        ${state.responsables.map(r=>`<option value="${r.codigo}" ${r.codigo===mov.responsableCodigo?'selected':''}>${escapeHtml(r.nombre)}</option>`).join('')}
      </select>
    </div>
    <label>Nota / nº albarán</label>
    <div class="field"><input type="text" id="e_nota" value="${escapeHtml(mov.nota||'')}"></div>
    <div class="btn-row">
      <button class="btn ghost" id="deleteMovBtn" style="border-color:var(--warn);color:var(--warn);">Eliminar movimiento</button>
      <button class="btn primary" id="saveMovBtn">Guardar cambios</button>
    </div>
  `;
  inner.querySelector('#closeSheet').addEventListener('click', ()=>document.getElementById('formsheet').close());
  inner.querySelector('#saveMovBtn').addEventListener('click', async ()=>{
    const eObraVal = inner.querySelector('#e_obra').value;
    let obraCodigo = null, obraLibre = '';
    if(eObraVal === '__OPERARIO__') obraLibre = 'Operario';
    else if(eObraVal === '__OTROS__') obraLibre = 'Otros';
    else obraCodigo = eObraVal || null;
    const cantidad = Number(inner.querySelector('#e_cantidad').value)||0;
    if(!obraCodigo && !obraLibre){ toast('Indica una obra'); return; }
    if(cantidad<=0){ toast('La cantidad debe ser mayor que 0'); return; }
    Object.assign(mov, {
      tipo: inner.querySelector('#e_tipo').value,
      codigoObra: obraCodigo,
      obraLibre: obraCodigo ? '' : obraLibre,
      codigoMaterial: inner.querySelector('#e_material').value,
      cantidad,
      obraDetalle: obraLibre ? inner.querySelector('#e_obraDetalle').value.trim() : '',
      responsableCodigo: inner.querySelector('#e_responsable').value || null,
      nota: inner.querySelector('#e_nota').value.trim()
    });
    await saveAll();
    document.getElementById('formsheet').close();
    toast('Movimiento actualizado ✓');
    render();
  });
  inner.querySelector('#deleteMovBtn').addEventListener('click', async ()=>{
    if(confirm('¿Eliminar este movimiento del historial? No se puede deshacer.')){
      state.movimientos = state.movimientos.filter(m=>m.id!==mov.id);
      await saveAll();
      document.getElementById('formsheet').close();
      toast('Movimiento eliminado');
      render();
    }
  });
  document.getElementById('formsheet').showModal();
}

/* ---------------- INIT ---------------- */
const ACCESS_CODE = '1234';

function setupLock(){
  const lockScreen = document.getElementById('lockScreen');
  const input = document.getElementById('lockInput');
  const btn = document.getElementById('lockBtn');
  const err = document.getElementById('lockErr');
  function tryUnlock(){
    if(input.value.trim() === ACCESS_CODE){
      lockScreen.style.display = 'none';
      startApp();
    } else {
      err.textContent = 'Código incorrecto, inténtalo de nuevo';
      input.value = '';
      input.focus();
    }
  }
  btn.addEventListener('click', tryUnlock);
  input.addEventListener('keydown', e=>{ if(e.key==='Enter') tryUnlock(); });
  setTimeout(()=>input.focus(), 200);
}

async function startApp(){
  if(!jsonbinConfigured()){
    renderSetupNeeded();
    return;
  }
  toast('Cargando datos...');
  await loadAll();
  render();
}
function renderSetupNeeded(){
  document.getElementById('app').innerHTML = `
    <div style="padding:60px 24px;text-align:center;max-width:380px;margin:0 auto;">
      <h2 style="font-family:var(--font-display);text-transform:uppercase;font-size:18px;letter-spacing:0.03em;margin-bottom:12px;">
        Falta configurar el almacenamiento
      </h2>
      <p style="color:var(--ink-soft);font-size:14px;line-height:1.6;">
        Abre el archivo HTML con un editor de texto, busca <code>JSONBIN_API_KEY</code> y <code>JSONBIN_BIN_ID</code>
        cerca del principio del script, y rellénalos con tus datos de
        <a href="https://jsonbin.io" target="_blank" style="color:var(--accent-out);">jsonbin.io</a>.
        Luego vuelve a subir el archivo.
      </p>
    </div>`;
}
async function refreshData(){
  toast('Actualizando...');
  await loadAll();
  render();
}

setupLock();
