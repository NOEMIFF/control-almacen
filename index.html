<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Control de Almacén</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
<style>
:root{
  --canvas:#F0EFEC; --card:#FFFFFF; --sunk:#F4F3F0;
  --ink:#16171A; --ink-2:#6A6C71; --ink-3:#A2A4A9; --line:#E5E4DF;
  --signal:#FFC800; --signal-ink:#16171A;
  --out:#C74A11; --out-soft:#F9E9E0;
  --in:#20794A;  --in-soft:#E1EFE7;
  --red:#C22E2E; --red-soft:#FAE7E7;
  --r:18px;
}
[data-theme="dark"]{
  --canvas:#0F0F11; --card:#1A1A1D; --sunk:#242428;
  --ink:#F5F4F2; --ink-2:#9EA0A6; --ink-3:#6B6D73; --line:#2A2A2E;
  --out:#F0844B; --out-soft:#2A1911;
  --in:#4FBE7A;  --in-soft:#12251A;
  --red:#F27070; --red-soft:#2A1515;
}
*{box-sizing:border-box}
html,body{margin:0}
html{overflow-y:scroll}
body{background:var(--canvas);color:var(--ink);
  font:400 16px/1.45 Manrope,system-ui,sans-serif;-webkit-font-smoothing:antialiased;padding-bottom:154px}
body.locked{overflow:hidden}
h1,h2,h3{margin:0;font-family:"Bricolage Grotesque",system-ui,sans-serif;font-weight:800;letter-spacing:-.035em;line-height:1.02}
h1{font-size:36px}
button{font-family:inherit;color:inherit}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px;border-radius:8px}
[data-theme="dark"] :focus-visible{outline-color:var(--signal)}
.wrap{max-width:680px;margin:0 auto;padding:0 16px}
.muted{color:var(--ink-2)}
.head{padding:24px 0 18px;display:flex;align-items:flex-end;gap:12px}
.head .tx{flex:1}
.head p{margin:8px 0 0;color:var(--ink-2);font-size:14.5px}
.sec{font-family:"Bricolage Grotesque",sans-serif;font-weight:600;font-size:14px;color:var(--ink-2);margin:24px 0 10px}

/* PASOS */
.step{background:var(--card);border-radius:var(--r);margin-bottom:10px;overflow:hidden;transition:box-shadow .2s}
.step[data-state="active"]{box-shadow:0 0 0 2px var(--ink)}
[data-theme="dark"] .step[data-state="active"]{box-shadow:0 0 0 2px var(--signal)}
.step-top{display:flex;align-items:center;gap:14px;width:100%;background:transparent;border:0;padding:18px;cursor:pointer;text-align:left}
.num{width:32px;height:32px;border-radius:50%;background:var(--sunk);color:var(--ink-3);flex:none;
  display:grid;place-items:center;font-weight:800;font-size:14px;transition:.18s}
.step[data-state="active"] .num{background:var(--ink);color:var(--card)}
[data-theme="dark"] .step[data-state="active"] .num{background:var(--signal);color:var(--signal-ink)}
.step[data-state="done"] .num{background:var(--signal);color:var(--signal-ink)}
.num .tick{display:none}.step[data-state="done"] .num .tick{display:block}
.step[data-state="done"] .num .digit{display:none}
.step-top .tx{flex:1;min-width:0}.step-top h3{font-size:17px;font-weight:800}
.step-top .sum{display:none;font-size:13.5px;color:var(--ink-2);margin-top:3px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.step[data-state="done"] .sum{display:block}
.step-top .arrow{color:var(--ink-3);transition:transform .2s;flex:none}
.step[data-state="active"] .arrow{transform:rotate(180deg)}
.step-body{padding:0 18px 20px;display:none}
.step[data-state="active"] .step-body{display:block}
.step.bad{box-shadow:0 0 0 2px var(--red)}.step.bad .num{background:var(--red);color:#fff}

/* CAMPOS */
.field{margin-bottom:12px}.field:last-child{margin-bottom:0}
.field > label{display:block;font-size:13px;font-weight:700;color:var(--ink-2);margin-bottom:8px}
select,input[type=text],input[type=search],input[type=number],input[type=file],textarea{
  width:100%;min-height:56px;padding:16px;background:var(--sunk);color:var(--ink);
  border:2px solid transparent;border-radius:14px;font:500 16px/1.3 Manrope,sans-serif}
select{font-weight:600}
select:focus,input:focus,textarea:focus{outline:none;border-color:var(--ink)}
input::placeholder{color:var(--ink-3);font-weight:400}
input[readonly]{color:var(--ink-3);font-weight:600}
select{appearance:none;padding-right:48px;cursor:pointer;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='13' height='9' fill='none' stroke='%236A6C71' stroke-width='2.4' stroke-linecap='round'><path d='M1.5 1.5 6.5 6.5 11.5 1.5'/></svg>");
  background-repeat:no-repeat;background-position:calc(100% - 18px) center}
.bad select,.bad input{border-color:var(--red);background:var(--red-soft)}
.hint{font-size:14px;font-weight:700;color:var(--red);margin:9px 0 0;text-align:center}
.note{font-size:13px;color:var(--ink-2);margin:8px 0 0;font-weight:500}
.search{position:relative}
.search svg{position:absolute;left:17px;top:50%;transform:translateY(-50%);color:var(--ink-3)}
.search input{padding-left:48px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* ELECCIÓN */
.choice{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.choice button{padding:16px 14px;border:2px solid var(--line);border-radius:15px;background:transparent;cursor:pointer;text-align:left}
.choice .ic{width:36px;height:36px;border-radius:11px;background:var(--sunk);color:var(--ink-2);display:grid;place-items:center;margin-bottom:11px;transition:.18s}
.choice b{display:block;font-size:17px;font-weight:800;font-family:"Bricolage Grotesque",sans-serif;letter-spacing:-.02em}
.choice small{display:block;font-size:12.5px;color:var(--ink-2);margin-top:3px;line-height:1.3}
.choice button[aria-pressed="true"][data-kind="out"]{border-color:var(--out);background:var(--out-soft)}
.choice button[aria-pressed="true"][data-kind="out"] .ic{background:var(--out);color:#fff}
.choice button[aria-pressed="true"][data-kind="in"]{border-color:var(--in);background:var(--in-soft)}
.choice button[aria-pressed="true"][data-kind="in"] .ic{background:var(--in);color:#fff}

/* BOTONES */
.btn{min-height:56px;padding:0 22px;border:2px solid transparent;border-radius:15px;cursor:pointer;
  background:var(--card);font-size:16px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:10px}
.btn-block{display:flex;width:100%}
.btn-signal{background:var(--signal);color:var(--signal-ink)}
.btn-ink{background:var(--ink);color:var(--card)}
[data-theme="dark"] .btn-ink{color:var(--canvas)}
.btn-line{background:transparent;border-color:var(--line)}
.btn-red{background:transparent;color:var(--red);border-color:var(--red)}
.btn-sm{min-height:44px;font-size:14px;border-radius:12px;padding:0 16px}
.btn-scan{min-height:68px;font-size:18px;font-family:"Bricolage Grotesque",sans-serif;font-weight:800;letter-spacing:-.02em}
.btn:disabled{opacity:.45;cursor:not-allowed}
.icon-btn{width:40px;height:40px;border-radius:12px;border:0;background:var(--sunk);color:var(--ink-2);display:grid;place-items:center;cursor:pointer;flex:none}
.icon-btn:hover{background:var(--ink);color:var(--card)}

/* FILAS */
.row{display:flex;align-items:center;gap:12px;padding:14px 0;border-top:1px solid var(--line)}
.cat-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;padding:14px 0;border-top:1px solid var(--line)}
.cat-row:first-child{border-top:0}
.cat-row .t{flex:1 1 150px;min-width:0}
.cat-row .acts{display:flex;align-items:center;gap:8px;margin-left:auto}
@media (max-width:480px){
  .cat-row .acts{flex-basis:100%;margin-left:0;justify-content:flex-end}
}
.row:first-child{border-top:0}
.row .t{flex:1;min-width:0}
.row .t b{display:block;font-size:15.5px;font-weight:700;line-height:1.3}
.row .t small{display:block;font-size:12.5px;color:var(--ink-2);margin-top:3px;font-weight:500}
.thumb{width:46px;height:46px;border-radius:13px;background:var(--sunk);flex:none;object-fit:cover}
.qty{display:flex;align-items:center;background:var(--sunk);border-radius:13px;flex:none}
.qty button{width:42px;height:44px;border:0;background:transparent;font-size:20px;font-weight:700;cursor:pointer;border-radius:13px}
.qty button:active{background:var(--signal);color:var(--signal-ink)}
.qty input{width:46px;height:44px;min-height:0;padding:0;text-align:center;background:transparent;border:0;
  font:800 17px Manrope,sans-serif;font-variant-numeric:tabular-nums;border-radius:0}

/* ETIQUETAS */
.tag{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:9px;font-size:12.5px;font-weight:800;background:var(--sunk);color:var(--ink-2);border:0;cursor:default;font-family:inherit}
.tag.out{background:var(--out-soft);color:var(--out)}
.tag.in{background:var(--in-soft);color:var(--in)}
.tag.sig{background:var(--signal);color:var(--signal-ink)}
.tag.off{background:transparent;border:2px solid var(--line);color:var(--ink-3)}
.tag.click{cursor:pointer}
.pill{display:inline-flex;align-items:center;gap:9px;padding:9px 11px 9px 15px;border-radius:999px;background:var(--ink);color:var(--card);font-size:14px;font-weight:700}
.code-copy{text-decoration:underline dotted;cursor:pointer;}
[data-theme="dark"] .pill{color:var(--canvas)}
.pill button{border:0;background:transparent;cursor:pointer;font-size:15px;padding:0;opacity:.65;color:inherit}

/* BARRA FIJA */
.actionbar{position:fixed;left:0;right:0;bottom:78px;z-index:25;padding:12px 16px 14px;background:linear-gradient(to top,var(--canvas) 66%,transparent)}
.actionbar .in{max-width:680px;margin:0 auto}
.save{width:100%;min-height:64px;border:0;border-radius:17px;background:var(--out);color:#fff;
  font-family:"Bricolage Grotesque",sans-serif;font-size:19px;font-weight:800;letter-spacing:-.02em;
  cursor:pointer;display:flex;align-items:center;justify-content:center;gap:12px}
.save[data-kind="in"]{background:var(--in)}
.save .n{font-family:Manrope,sans-serif;font-size:14px;font-weight:600;opacity:.82;letter-spacing:0}
[data-theme="dark"] .save{color:#0F0F11}

/* TARJETAS */
.card{background:var(--card);border-radius:var(--r);padding:16px 18px;margin-bottom:10px}
.card-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding-bottom:8px}
.card-head b{font-size:16.5px;font-weight:800;font-family:"Bricolage Grotesque",sans-serif;letter-spacing:-.02em;cursor:pointer}
.card-head .sp{flex:1}
details.more{border-top:1px solid var(--line);margin-top:8px;padding-top:12px}
details.more summary{list-style:none;cursor:pointer;font-size:14px;font-weight:700;color:var(--ink-2)}
details.more summary::-webkit-details-marker{display:none}
details.more dl{display:grid;grid-template-columns:auto 1fr;gap:7px 16px;margin:13px 0 0;font-size:14.5px}
details.more dt{color:var(--ink-2);font-size:12.5px;font-weight:700}
details.more dd{margin:0}

.pend{display:flex;align-items:center;gap:13px;width:100%;text-align:left;border:0;background:var(--card);
  padding:17px 18px;border-radius:15px;margin-bottom:8px;cursor:pointer;font:inherit;color:inherit}
.pend .t{flex:1}
.pend .t b{font-size:16px;font-weight:800;display:block;font-family:"Bricolage Grotesque",sans-serif;letter-spacing:-.02em}
.pend .t small{font-size:12.5px;color:var(--ink-2);font-weight:600}
.check-row{display:flex;align-items:center;gap:13px;padding:14px 0;border-top:1px solid var(--line);cursor:pointer}
.check-row:first-child{border-top:0}
.check-row input{position:absolute;opacity:0;pointer-events:none}
.box{width:27px;height:27px;border-radius:10px;border:2px solid var(--line);display:grid;place-items:center;flex:none;color:transparent}
.check-row input:checked + .box{background:var(--in);border-color:var(--in);color:#fff}

/* FIRMA */
.sign{position:relative;background:var(--sunk);border-radius:15px;overflow:hidden}
.sign canvas{display:block;width:100%;height:186px;touch-action:none}
.sign .rule{position:absolute;left:22px;right:22px;bottom:44px;border-bottom:2px solid var(--line);pointer-events:none}
.sign .cap{position:absolute;left:22px;bottom:17px;font-size:13px;font-weight:700;color:var(--ink-3);pointer-events:none}

/* CONFIRMACIÓN */
.done{background:var(--card);border-radius:22px;padding:46px 22px;text-align:center}
.mark{width:88px;height:88px;margin:0 auto 22px;border-radius:28px;background:var(--signal);display:grid;place-items:center;animation:pop .42s cubic-bezier(.2,1.4,.4,1)}
.mark svg{width:42px;height:42px;stroke:var(--signal-ink);stroke-width:3.2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.mark svg path{stroke-dasharray:40;stroke-dashoffset:40;animation:draw .44s .16s cubic-bezier(.65,0,.35,1) forwards}
@keyframes pop{from{transform:scale(.72) rotate(-7deg);opacity:0}}
@keyframes draw{to{stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){.mark,.mark svg path{animation:none;stroke-dashoffset:0}}
.done h2{font-size:28px;margin-bottom:11px}
.done p{color:var(--ink-2);margin:0 0 28px;font-weight:500}

/* NAV */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(6,1fr);padding-bottom:env(safe-area-inset-bottom)}
.nav button{border:0;background:transparent;color:var(--ink-3);cursor:pointer;padding:10px 2px 11px;display:grid;justify-items:center;gap:4px;font-size:10.5px;font-weight:700}
.nav .ic{padding:4px 13px;border-radius:11px;display:grid;place-items:center;transition:.18s}
.nav button svg{width:22px;height:22px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.nav button[aria-current="page"]{color:var(--ink)}
.nav button[aria-current="page"] .ic{background:var(--signal);color:var(--signal-ink)}

/* MODAL */
.scrim{position:fixed;inset:0;z-index:50;background:rgba(10,10,12,.5);backdrop-filter:blur(3px);
  display:none;align-items:flex-end;justify-content:center}
.scrim.on{display:flex}
.modal{background:var(--card);width:100%;max-width:560px;border-radius:26px 26px 0 0;max-height:92vh;overflow:auto;
  animation:up .28s cubic-bezier(.3,1,.4,1)}
@keyframes up{from{transform:translateY(24px);opacity:0}}
@media (prefers-reduced-motion:reduce){.modal{animation:none}}
.modal-top{position:sticky;top:0;background:var(--card);display:flex;align-items:center;gap:12px;
  padding:20px 20px 14px;border-bottom:1px solid var(--line);z-index:2}
.modal-top h2{font-size:21px;flex:1}
.grab{width:38px;height:4px;border-radius:99px;background:var(--line);margin:9px auto 0}
.modal-body{padding:18px 20px 22px}
.modal-foot{position:sticky;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:14px 20px;
  display:flex;gap:10px}
.modal-foot .btn{flex:1}
@media (min-width:720px){
  .scrim{align-items:center}
  .modal{border-radius:24px;max-height:86vh}
}

/* FOTO */
.photo{display:flex;gap:12px;align-items:center}
.photo .prev{width:76px;height:76px;border-radius:16px;background:var(--sunk);flex:none;display:grid;place-items:center;color:var(--ink-3);overflow:hidden}
.photo .prev img{width:100%;height:100%;object-fit:cover}

/* ESCÁNER */
.scanner{position:fixed;inset:0;z-index:55;background:#0B0B0C;display:none;flex-direction:column;color:#fff}
.scanner.on{display:flex}
.scan-top{display:flex;align-items:center;gap:12px;padding:20px 18px}
.scan-top b{flex:1;font-family:"Bricolage Grotesque",sans-serif;font-size:19px;font-weight:800}
.scan-top .x{width:42px;height:42px;border-radius:50%;border:0;background:rgba(255,255,255,.12);color:#fff;cursor:pointer;display:grid;place-items:center}
.viewport{flex:1;position:relative;display:grid;place-items:center;overflow:hidden;
  background:repeating-linear-gradient(0deg,#141416 0 2px,#111113 2px 4px)}
.viewport video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.frame{width:min(74vw,290px);aspect-ratio:1;position:relative}
.frame i{position:absolute;width:38px;height:38px;border:4px solid var(--signal)}
.frame i:nth-child(1){top:0;left:0;border-right:0;border-bottom:0;border-radius:14px 0 0 0}
.frame i:nth-child(2){top:0;right:0;border-left:0;border-bottom:0;border-radius:0 14px 0 0}
.frame i:nth-child(3){bottom:0;left:0;border-right:0;border-top:0;border-radius:0 0 0 14px}
.frame i:nth-child(4){bottom:0;right:0;border-left:0;border-top:0;border-radius:0 0 14px 0}
.laser{position:absolute;left:6%;right:6%;height:3px;background:var(--signal);border-radius:99px;
  box-shadow:0 0 18px var(--signal);animation:sweep 2.1s ease-in-out infinite}
@keyframes sweep{0%,100%{top:8%}50%{top:88%}}
@media (prefers-reduced-motion:reduce){.laser{animation:none;top:50%}}
.scan-foot{padding:18px;text-align:center}
.scan-foot p{color:rgba(255,255,255,.62);font-size:14.5px;font-weight:600;margin:0 0 14px}

/* ETIQUETA QR */
.label-sheet{background:#fff;color:#111;border-radius:16px;padding:20px;display:flex;gap:18px;align-items:center}
.label-sheet .qr{width:118px;height:118px;flex:none}
.label-sheet .meta b{display:block;font-family:"Bricolage Grotesque",sans-serif;font-size:19px;font-weight:800;letter-spacing:-.02em;line-height:1.15}
.label-sheet .meta small{display:block;font-size:13px;color:#666;margin-top:5px;font-weight:600}
.label-sheet .meta .code{margin-top:10px;font-size:24px;font-weight:800;letter-spacing:.04em}

/* RESUMEN */
.total-row{display:flex;align-items:baseline;gap:12px;padding:13px 0;border-top:1px solid var(--line)}
.total-row:first-child{border-top:0}
.total-row .t{flex:1}
.total-row b{font-weight:800;font-size:17px;font-variant-numeric:tabular-nums}
.bar{height:6px;border-radius:99px;background:var(--sunk);overflow:hidden;margin-top:7px}
.bar i{display:block;height:100%;background:var(--signal)}

.toast{position:fixed;left:16px;right:16px;bottom:158px;z-index:70;max-width:440px;margin:0 auto;
  background:var(--ink);color:var(--card);padding:16px 18px;border-radius:15px;font-size:15px;font-weight:700;
  display:flex;gap:10px;align-items:center;opacity:0;transform:translateY(8px);transition:.22s;pointer-events:none}
.toast.on{opacity:1;transform:none}
[data-theme="dark"] .toast{background:var(--signal);color:var(--signal-ink)}

/* BLOQUEO */
.lock{position:fixed;inset:0;z-index:60;background:var(--ink);color:#F5F4F2;display:grid;place-items:center;padding:24px}
.lock-in{width:100%;max-width:312px;text-align:center}
.lock h1{font-size:32px;margin-bottom:7px;color:#fff}
.lock .sub{font-size:14px;color:rgba(255,255,255,.5);margin:0 0 32px;font-weight:500}
.dots{display:flex;gap:16px;justify-content:center;margin-bottom:38px;transition:transform .12s}
.dots.err{animation:shakeDots .4s}
@keyframes shakeDots{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.dots i{width:14px;height:14px;border-radius:50%;border:2px solid rgba(255,255,255,.3);transition:.15s}
.dots i.on{background:var(--signal);border-color:var(--signal);transform:scale(1.1)}
.dots.err i.on{background:var(--red);border-color:var(--red)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.pad button{height:72px;border-radius:20px;border:0;background:rgba(255,255,255,.08);color:#fff;font:800 24px Manrope,sans-serif;cursor:pointer}
.pad button:active{background:var(--signal);color:var(--signal-ink)}
.pad .plain{background:transparent;font-size:14px;font-weight:700;color:rgba(255,255,255,.55)}

.panel{display:none}.panel.on{display:block}
.subtabs{display:flex;gap:8px;margin-bottom:14px}
.empty{text-align:center;padding:28px 12px;color:var(--ink-2);font-size:14px;font-weight:500}
.stat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:6px}
@media (min-width:480px){.stat-grid{grid-template-columns:repeat(4,1fr)}}
.stat-tile{background:var(--card);border-radius:16px;padding:16px 10px;text-align:center}
.stat-tile b{display:block;font-family:"Bricolage Grotesque",sans-serif;font-size:26px;font-weight:800;letter-spacing:-.02em}
.stat-tile span{display:block;font-size:11px;color:var(--ink-2);font-weight:700;text-transform:uppercase;letter-spacing:.03em;margin-top:4px}
.alert-row{display:flex;align-items:center;gap:12px;padding:13px 0;border-top:1px solid var(--line);cursor:pointer}
.alert-row:first-child{border-top:0}

@media (min-width:920px){

<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];

/* ================= ESTADO Y ALMACENAMIENTO (igual que antes) ================= */
const state = { materiales: [], obras: [], responsables: [], movimientos: [], sugerencias: [], assets:{}, loaded:false };
const formState = { tipo:'Salida', obraCodigo:null, obraLibre:'', obraDetalle:'', lineas:[], responsableCodigo:null, nota:'', materialSearchQuery:'' };
const recibiState = { obraCodigo:null, obraLibre:'', seleccion:{}, nombre:'', firmaVacia:true };
let ultimoMovimiento = null;
let scanning=false, stream=null, rafId=null, detector=null, audioCtx=null, scanCanvas=null, currentSigCanvas=null;
let currentTab='ini', catalogSub='materiales', movStep=2, recStep=1, currentTheme='auto';
let hisQuickFecha=null, hisQuickObra=null, hisQuickTipo=null, hisPage=1;

const seedMateriales = [{codigo:'MAT-001', descripcion:'Cemento gris 25kg', unidad:'sacos', proveedor:'', codigoProveedor:'', codigoPropio:'', ejemplo:true, actualizadoEn:1}];
const seedObras = [{codigo:'OBR-001', nombre:'Reforma Calle Mayor 12', responsable:'Encargado', estado:'Activa', ejemplo:true, actualizadoEn:1}];
const seedResponsables = [{codigo:'RESP-001', nombre:'Encargado de almacén', ejemplo:true, actualizadoEn:1}];

/* 1) Cuenta gratuita en https://jsonbin.io
   2) Tu API Key en https://jsonbin.io/api-keys -> pégala en JSONBIN_API_KEY
      (esa clave da acceso a TODOS los bins de tu cuenta: usa una cuenta dedicada solo a esta app)
   3) Bin principal, contenido inicial:
      {"materiales":[{"codigo":"MAT-001","descripcion":"Cemento gris 25kg","unidad":"sacos","proveedor":"","codigoProveedor":"","codigoPropio":"","ejemplo":true,"actualizadoEn":1}],"obras":[{"codigo":"OBR-001","nombre":"Reforma Calle Mayor 12","responsable":"Encargado","estado":"Activa","ejemplo":true,"actualizadoEn":1}],"responsables":[{"codigo":"RESP-001","nombre":"Encargado de almacén","ejemplo":true,"actualizadoEn":1}],"movimientos":[]}
      -> pega su ID en JSONBIN_BIN_ID
   4) Bin de fotos/firmas, contenido inicial: {}  -> pega su ID en JSONBIN_ASSETS_BIN_ID (opcional) */
const JSONBIN_API_KEY = '$2a$10$5DKABYP8CsU.TCkAeSesNOwMQaCRfbMhtwPa4Cd5R2nZBJbhSR8NC';
const JSONBIN_BIN_ID  = '6a7afae3f5f4af5e2906a31b';
const JSONBIN_ASSETS_BIN_ID = 'PASTE_TU_ASSETS_BIN_ID_AQUI';
const JSONBIN_URL = 'https://api.jsonbin.io/v3/b/' + JSONBIN_BIN_ID;
const JSONBIN_ASSETS_URL = 'https://api.jsonbin.io/v3/b/' + JSONBIN_ASSETS_BIN_ID;

function jsonbinConfigured(){ return JSONBIN_API_KEY && !JSONBIN_API_KEY.includes('PASTE') && JSONBIN_BIN_ID && !JSONBIN_BIN_ID.includes('PASTE'); }
function assetsConfigured(){ return JSONBIN_ASSETS_BIN_ID && !JSONBIN_ASSETS_BIN_ID.includes('PASTE'); }
function touch(obj){ obj.actualizadoEn = Date.now(); return obj; }
function mergeCollections(remote, local, idKey){
  const map = {};
  (remote||[]).forEach(item=>{ map[item[idKey]] = item; });
  (local||[]).forEach(item=>{
    const existing = map[item[idKey]];
    if(!existing || (item.actualizadoEn||0) >= (existing.actualizadoEn||0)) map[item[idKey]] = item;
  });
  return Object.values(map);
}
let lastLoadError = null;
async function loadAll(){
  try{
    const res = await fetch(JSONBIN_URL + '/latest', { headers:{ 'X-Master-Key': JSONBIN_API_KEY } });
    if(!res.ok){
      let detail = '';
      try{ const j = await res.json(); detail = j.message || JSON.stringify(j); }catch(e){ try{ detail = await res.text(); }catch(e2){} }
      throw new Error('HTTP '+res.status+(detail?' — '+detail.slice(0,200):''));
    }
    const data = await res.json();
    const record = data.record || {};
    state.materiales = record.materiales || seedMateriales;
    state.obras = record.obras || seedObras;
    state.responsables = record.responsables || seedResponsables;
    state.movimientos = record.movimientos || [];
    state.sugerencias = record.sugerencias || [];
    lastLoadError = null;
  }catch(e){
    console.error('load error', e);
    lastLoadError = (e && e.message) ? e.message : String(e);
    if(!state.loaded){ state.materiales=seedMateriales; state.obras=seedObras; state.responsables=seedResponsables; state.movimientos=[]; state.sugerencias=[]; }
  }
  if(assetsConfigured()){
    try{
      const res2 = await fetch(JSONBIN_ASSETS_URL + '/latest', { headers:{ 'X-Master-Key': JSONBIN_API_KEY } });
      if(res2.ok){ const data2 = await res2.json(); state.assets = data2.record || {}; }
    }catch(e){ console.error('assets load error', e); }
  }
  state.loaded = true;
}
async function saveAll(){
  try{
    let remote = {materiales:[], obras:[], responsables:[], movimientos:[], sugerencias:[]};
    try{
      const getRes = await fetch(JSONBIN_URL + '/latest', { headers:{ 'X-Master-Key': JSONBIN_API_KEY } });
      if(getRes.ok){ const data = await getRes.json(); remote = data.record || remote; }
    }catch(e){ console.error('pre-save fetch error', e); }
    const merged = {
      materiales: mergeCollections(remote.materiales, state.materiales, 'codigo'),
      obras: mergeCollections(remote.obras, state.obras, 'codigo'),
      responsables: mergeCollections(remote.responsables, state.responsables, 'codigo'),
      movimientos: mergeCollections(remote.movimientos, state.movimientos, 'id'),
      sugerencias: mergeCollections(remote.sugerencias, state.sugerencias, 'id'),
    };
    const res = await fetch(JSONBIN_URL, { method:'PUT', headers:{ 'Content-Type':'application/json', 'X-Master-Key': JSONBIN_API_KEY }, body: JSON.stringify(merged) });
    if(!res.ok) throw new Error('HTTP '+res.status);
    state.materiales = merged.materiales; state.obras = merged.obras; state.responsables = merged.responsables; state.movimientos = merged.movimientos; state.sugerencias = merged.sugerencias;
    return true;
  }catch(e){
    console.error('save error', e);
    alert('No se pudo guardar. Revisa tu conexión e inténtalo de nuevo.');
    return false;
  }
}
async function saveAsset(id, dataUrl){
  state.assets[id] = dataUrl;
  if(!assetsConfigured()){ toast('Guardado solo en este dispositivo (falta configurar el bin de fotos)'); return; }
  try{
    const getRes = await fetch(JSONBIN_ASSETS_URL + '/latest', { headers:{ 'X-Master-Key': JSONBIN_API_KEY } });
    let remoteAssets = {};
    if(getRes.ok){ const data = await getRes.json(); remoteAssets = data.record || {}; }
    remoteAssets[id] = dataUrl;
    const res = await fetch(JSONBIN_ASSETS_URL, { method:'PUT', headers:{ 'Content-Type':'application/json', 'X-Master-Key': JSONBIN_API_KEY }, body: JSON.stringify(remoteAssets) });
    if(!res.ok) throw new Error('HTTP '+res.status);
    state.assets = remoteAssets;
  }catch(e){ console.error('asset save error', e); toast('No se pudo guardar la imagen'); }
}

/* ================= AYUDANTES ================= */
function toast(msg){
  $('#toastTxt').textContent = msg;
  $('#toast').classList.add('on');
  clearTimeout(window.__tt);
  window.__tt = setTimeout(()=>$('#toast').classList.remove('on'), 2600);
}
function nextCodigo(prefix, arr){
  let max=0; arr.forEach(x=>{ const m=/-(\d+)$/.exec(x.codigo); if(m) max=Math.max(max, parseInt(m[1],10)); });
  return prefix+'-'+String(max+1).padStart(3,'0');
}
function findMaterial(codigo){ return state.materiales.find(m=>m.codigo===codigo || (m.codigoPropio && m.codigoPropio===codigo)); }
function materialFoto(m){ return m.foto || (m.fotoId ? state.assets[m.fotoId] : null); }
function findObra(codigo){ return state.obras.find(o=>o.codigo===codigo); }
function findResponsable(codigo){ return state.responsables.find(r=>r.codigo===codigo); }
function fmtDate(iso){ const d=new Date(iso); return d.toLocaleDateString('es-ES',{day:'2-digit',month:'2-digit',year:'2-digit'})+' '+d.toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'}); }
function fmtDateOnly(iso){ const d=new Date(iso); return d.toLocaleDateString('es-ES',{day:'numeric',month:'long'}); }
function movimientosActivos(){ return state.movimientos.filter(m=>!m.eliminado); }
function escapeHtml(s){ return (s||'').replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function resizeImageFile(file, maxW, maxH, quality){
  maxW=maxW||480; maxH=maxH||480; quality=quality||0.7;
  return new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onload = ()=>{
      const img = new Image();
      img.onload = ()=>{
        let w=img.width, h=img.height;
        const scale = Math.min(1, maxW/w, maxH/h);
        w=Math.max(1,Math.round(w*scale)); h=Math.max(1,Math.round(h*scale));
        const canvas = document.createElement('canvas'); canvas.width=w; canvas.height=h;
        canvas.getContext('2d').drawImage(img,0,0,w,h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror=reject; img.src=reader.result;
    };
    reader.onerror=reject; reader.readAsDataURL(file);
  });
}
function unlockAudio(){
  try{
    if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
    if(audioCtx.state==='suspended') audioCtx.resume();
    const osc=audioCtx.createOscillator(), gain=audioCtx.createGain();
    osc.frequency.value=440; gain.gain.setValueAtTime(0.00001, audioCtx.currentTime);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(audioCtx.currentTime); osc.stop(audioCtx.currentTime+0.05);
  }catch(e){}
}
function playBeep(){
  try{
    if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
    if(audioCtx.state==='suspended') audioCtx.resume();
    const osc=audioCtx.createOscillator(), gain=audioCtx.createGain();
    osc.type='sine'; osc.frequency.value=1046.5;
    gain.gain.setValueAtTime(0.0001, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.35, audioCtx.currentTime+0.01);
    gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime+0.16);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(); osc.stop(audioCtx.currentTime+0.17);
  }catch(e){}
  if(navigator.vibrate){ try{ navigator.vibrate(60); }catch(e){} }
}

const PER_PAGE = 10;
function pagerHtml(page, totalPages, idPrefix){
  if(totalPages<=1) return '';
  return `<div style="display:flex;justify-content:center;align-items:center;gap:16px;padding:18px 0 4px;">
    <button class="icon-btn" id="${idPrefix}Prev" ${page<=1?'disabled':''} aria-label="Anterior">${ICON_PREV}</button>

    <button class="icon-btn" id="${idPrefix}Next" ${page>=totalPages?'disabled':''} aria-label="Siguiente">${ICON_NEXT}</button>
  </div>`;

function wireCopyButtons(){
  $$('[data-copy]').forEach(el=>el.addEventListener('click', e=>{
    e.stopPropagation();
    const val = el.dataset.copy;
    if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(val).then(()=>toast('Copiado')).catch(()=>toast('No se pudo copiar')); }
    else toast('Copiar no disponible en este navegador');
  }));

  $$('.panel').forEach(p=>p.classList.toggle('on', p.id==='panel-'+name));
  currentTab = name;
  renderCurrentPanel();
  scrollTo(0,0);
}
$$('.nav button').forEach(b=>b.addEventListener('click', ()=>{ ultimoMovimiento=null; goTab(b.dataset.go); }));

function stockGlobal(codigo){
  let ent=0, sal=0;
  movimientosActivos().forEach(m=>{
    if(m.codigoMaterial!==codigo) return;
    if(m.tipo==='Entrada') ent+=Number(m.cantidad)||0; else sal+=Number(m.cantidad)||0;
  });
  return ent-sal;
}

function wireMovEvents(el){
  el.querySelectorAll('[data-stepbtn]').forEach(b=>b.addEventListener('click', ()=>{
    const n = Number(b.dataset.stepbtn);
    movStep = (movStep===n) ? null : n;
    renderMov();
  }));
  el.querySelectorAll('.choice button').forEach(b=>b.addEventListener('click', ()=>{
    formState.tipo = b.dataset.kind==='out' ? 'Salida' : 'Entrada';
    movStep = tieneObraMov() ? null : 2;
    renderMov();
  }));
  const obraSel = el.querySelector('#obraSel');
  if(obraSel) obraSel.addEventListener('change', e=>{
    const v = e.target.value;
    if(v.startsWith('obra:')){ formState.obraCodigo=v.slice(5); formState.obraLibre=''; formState.obraDetalle=''; }
    else if(v.startsWith('libre:')){ formState.obraCodigo=null; formState.obraLibre=v.slice(6); }
    else { formState.obraCodigo=null; formState.obraLibre=''; formState.obraDetalle=''; }
    movStep = tieneObraMov() ? 3 : 2;
    renderMov();
  });
  const quienDet = el.querySelector('#quienDet');
  if(quienDet) quienDet.addEventListener('input', e=> formState.obraDetalle = e.target.value);
  const respSel = el.querySelector('#respSel');
  if(respSel) respSel.addEventListener('change', e=> formState.responsableCodigo = e.target.value || null);
  const scanBtn = el.querySelector('#scanBtnMov');
  if(scanBtn) scanBtn.addEventListener('click', openScan);
  const searchInput = el.querySelector('#matSearchInput');
  if(searchInput) searchInput.addEventListener('input', e=>{
    formState.materialSearchQuery = e.target.value;

    wireMatSearchResults();
  });
  wireMatSearchResults();
  const notaInput = el.querySelector('#notaInput');
  if(notaInput) notaInput.addEventListener('input', e=> formState.nota = e.target.value);
  wireCartEvents(el);
}
function renderMatSearchHtml(){

  if(!q) return '';
  const list = state.materiales.filter(m=> !m.eliminado && (
    m.descripcion.toLowerCase().includes(q) || m.codigo.toLowerCase().includes(q) ||
    (m.codigoPropio && m.codigoPropio.toLowerCase().includes(q)) || (m.codigoProveedor && m.codigoProveedor.toLowerCase().includes(q))
  ));
  if(!list.length) return `<p class="note" style="padding:10px 2px">Sin resultados.</p>`;
  return `<div class="card" style="margin:8px 0 0;padding:6px 18px">` + list.map(m=>{

      ${foto?`<img class="thumb" src="${foto}">`:'<div class="thumb"></div>'}
      <div class="t"><b>${escapeHtml(m.descripcion)}</b><small>${[m.unidad, m.proveedor, m.codigoProveedor].filter(Boolean).map(escapeHtml).join(' · ')}</small></div>

  }).join('') + `</div>`;
}

function renderCartHtml(){
  if(!formState.lineas.length) return `<p class="note" style="text-align:center;padding:18px 0">Escanea o busca para añadir material.</p>`;
  return formState.lineas.map((l,i)=>{

      <div class="qty">

      </div>

function wireCartEvents(el){
  const cart = el.querySelector('#cart');
  if(!cart) return;
  cart.querySelectorAll('[data-lqty]').forEach(inp=>{
    inp.addEventListener('focus', e=>e.target.select());
    inp.addEventListener('input', e=>{
      const i = Number(e.target.dataset.lqty);
      formState.lineas[i].cantidad = e.target.value;
      const lv = formState.lineas.filter(l=>Number(l.cantidad)>0);
      const saveBtn = $('#movSaveBtn');
      saveBtn.innerHTML = (formState.tipo==='Salida'?'Guardar salida':'Guardar entrada') + (lv.length?` <span class="n">${lv.length} ${lv.length===1?'artículo':'artículos'}</span>`:'');
    });
  });
  cart.querySelectorAll('[data-lminus]').forEach(b=>b.addEventListener('click', ()=>{
    const i = Number(b.dataset.lminus); formState.lineas[i].cantidad = Math.max(0,(Number(formState.lineas[i].cantidad)||0)-1); renderMov();
  }));
  cart.querySelectorAll('[data-lplus]').forEach(b=>b.addEventListener('click', ()=>{
    const i = Number(b.dataset.lplus); formState.lineas[i].cantidad = (Number(formState.lineas[i].cantidad)||0)+1; renderMov();
  }));
  cart.querySelectorAll('[data-lremove]').forEach(b=>b.addEventListener('click', ()=>{
    const i = Number(b.dataset.lremove); formState.lineas.splice(i,1); renderMov();
  }));
}
function addMaterialALineas(codigoMaterial){
  const existente = formState.lineas.find(l=>l.materialCodigo===codigoMaterial);
  if(existente){ existente.cantidad = (Number(existente.cantidad)||0)+1; }
  else { formState.lineas.unshift({materialCodigo: codigoMaterial, cantidad: 1}); }
}
function badFlashStep(stepSelector){
  const stepEl = document.querySelector(stepSelector);
  if(!stepEl) return;
  stepEl.classList.add('bad');
  stepEl.scrollIntoView({behavior:'smooth', block:'center'});
  setTimeout(()=>stepEl.classList.remove('bad'), 1400);
}
async function guardarMovimiento(){
  const lineasValidas = formState.lineas.filter(l=>Number(l.cantidad)>0);
  if(!tieneObraMov()){
    movStep=2; renderMov(); badFlashStep('.step[data-step="2"]'); toast('Falta elegir el destino'); return;
  }
  if(lineasValidas.length===0){
    movStep=3; renderMov(); badFlashStep('.step[data-step="3"]'); toast('Añade al menos un material'); return;
  }
  const saveBtn = $('#movSaveBtn'); saveBtn.disabled = true;
  const fecha = new Date().toISOString(), ahora = Date.now();
  const grupoId = 'G'+ahora+'_'+Math.floor(Math.random()*10000);
  lineasValidas.forEach((l,i)=>{
    state.movimientos.push({
      id:'M'+ahora+'_'+i+'_'+Math.floor(Math.random()*10000), grupoId, fecha, actualizadoEn:ahora,
      tipo: formState.tipo, codigoMaterial: l.materialCodigo, cantidad: Number(l.cantidad),
      codigoObra: formState.obraCodigo || null,
      obraLibre: formState.obraCodigo ? '' : (formState.obraLibre||'').trim(),
      obraDetalle: formState.obraCodigo ? '' : (formState.obraDetalle||'').trim(),
      responsableCodigo: formState.responsableCodigo || null, nota: formState.nota || ''
    });
  });
  const ok = await saveAll();
  saveBtn.disabled = false;
  if(ok){
    const obraTexto = formState.obraCodigo ? (findObra(formState.obraCodigo)?.nombre||'') : (formState.obraLibre + (formState.obraDetalle?': '+formState.obraDetalle:''));
    ultimoMovimiento = { tipo: formState.tipo, cantidadArticulos: lineasValidas.length, obraTexto };
    formState.lineas = []; formState.nota = ''; movStep = 2;
  }
  renderMov();
}

/* ================= ESCÁNER ================= */
function openScan(){ unlockAudio(); $('#scanner').classList.add('on'); startCamera(); }
async function startCamera(){
  const video = $('#scanVideo');
  try{
    stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});
    video.srcObject = stream; await video.play();
    scanning = true; detectLoop(video);
  }catch(e){ toast('No se pudo acceder a la cámara'); closeScan(); }
}
function detectLoop(video){
  if(!scanning) return;
  if('BarcodeDetector' in window){
    if(!detector){ try{ detector = new BarcodeDetector({formats:['qr_code','ean_13','ean_8','upc_a','upc_e','code_128','code_39']}); }catch(e){ detector = new BarcodeDetector(); } }
    detector.detect(video).then(codes=>{
      if(codes && codes.length>0){ const v=codes[0].rawValue; closeScan(); onScanResult(v); }
      else { rafId = requestAnimationFrame(()=>detectLoop(video)); }
    }).catch(()=>{ rafId = requestAnimationFrame(()=>detectLoop(video)); });
  } else if(typeof jsQR==='function'){
    if(!scanCanvas) scanCanvas = document.createElement('canvas');
    const w=video.videoWidth, h=video.videoHeight;
    if(w && h){
      scanCanvas.width=w; scanCanvas.height=h;
      const ctx = scanCanvas.getContext('2d'); ctx.drawImage(video,0,0,w,h);
      const imgData = ctx.getImageData(0,0,w,h);
      const code = jsQR(imgData.data, w, h);
      if(code && code.data){ closeScan(); onScanResult(code.data); return; }
    }
    rafId = requestAnimationFrame(()=>detectLoop(video));
  } else { rafId = requestAnimationFrame(()=>detectLoop(video)); }
}
function closeScan(){
  scanning=false; if(rafId) cancelAnimationFrame(rafId);
  if(stream){ stream.getTracks().forEach(t=>t.stop()); stream=null; }
  $('#scanner').classList.remove('on');
}
$('#scanCloseBtn').addEventListener('click', closeScan);
$('#scanManualBtn').addEventListener('click', ()=>{
  closeScan();
  const val = prompt('Introduce el código:');
  if(val) onScanResult(val.trim());
});
function onScanResult(rawValue){
  playBeep();
  const value = (rawValue.split('\n')[0] || rawValue).trim();
  const mat = findMaterial(value) || findMaterial(rawValue.trim());
  if(mat){
    addMaterialALineas(mat.codigo);
    toast('Añadido: '+mat.descripcion);
    if(currentTab==='mov') renderMov();
  } else if(confirm('Código no reconocido: "'+value+'".\n¿Darlo de alta como material nuevo?')){
    goTab('cat'); catalogSub='materiales'; renderCatalogo();
    openMaterialModal(null, value);
  }
}

/* ================= RECIBÍ ================= */
function renderRecibi(){
  const el = $('#content-rec'); $('#recActionbar').style.display='';
  const todosPendientes = movimientosActivos().filter(m=> m.tipo==='Salida' && !m.recibido);
  function destinoKey(m){ return m.codigoObra ? 'obra:'+m.codigoObra : 'libre:'+m.obraLibre; }
  function destinoLabelFor(m){ if(m.codigoObra){ const o=findObra(m.codigoObra); return o?o.nombre:m.codigoObra; } return m.obraLibre + (m.obraDetalle?': '+m.obraDetalle:''); }
  const gm={}, orden=[];
  todosPendientes.forEach(m=>{
    const k=destinoKey(m);
    if(!gm[k]){ gm[k]={key:k, label:destinoLabelFor(m), tipoLbl:m.codigoObra?'Obra':m.obraLibre, items:[]}; orden.push(k); }
    gm[k].items.push(m);
  });
  const gruposPend = orden.map(k=>gm[k]).sort((a,b)=>b.items.length-a.items.length);

  function pendientesDestino(){
    return movimientosActivos().filter(m=>{
      if(m.tipo!=='Salida' || m.recibido) return false;
      if(recibiState.obraCodigo) return m.codigoObra===recibiState.obraCodigo;
      if(recibiState.obraLibre) return !m.codigoObra && m.obraLibre===recibiState.obraLibre;
      return false;
    });
  }
  const tieneDestino = !!(recibiState.obraCodigo || recibiState.obraLibre);
  const lista = tieneDestino ? pendientesDestino() : [];
  const seleccionCount = lista.filter(m=> recibiState.seleccion[m.id]!==false).length;
  const step1Filled = tieneDestino, step2Filled = tieneDestino && lista.length>0;
  const s1 = recStep===1?'active':(step1Filled?'done':'pending');
  const s2 = recStep===2?'active':(step2Filled?'done':'pending');
  const s3 = recStep===3?'active':'pending';
  const obrasActivas = state.obras.filter(o=>o.estado==='Activa' && !o.eliminado);
  const destinoLabel = tieneDestino ? (recibiState.obraCodigo?(findObra(recibiState.obraCodigo)?.nombre||''):recibiState.obraLibre) : '';

  el.innerHTML = `
    <div class="head"><div class="tx"><h1>Recibí</h1><p>Confirma con firma lo que ya está entregado.</p></div></div>
    <p class="sec">Pendientes de recibir</p>
    ${gruposPend.length ? gruposPend.map(g=>`
      <button class="pend" data-pendgroup="${g.key}"><div class="t"><b>${escapeHtml(g.label)}</b><small>${escapeHtml(g.tipoLbl)}</small></div>
        <span class="tag sig">${g.items.length} art.</span>${ICON_CHEVRON}</button>
    `).join('') : `<p class="empty">No hay entregas pendientes de confirmar.</p>`}

    <div class="step" data-step="1" data-state="${s1}" style="margin-top:16px">
      <button class="step-top" data-recstepbtn="1">
        <span class="num"><span class="digit">1</span>${ICON_TICK}</span>
        <span class="tx"><h3>Destino</h3><span class="sum">${escapeHtml(destinoLabel)}</span></span>${ICON_ARROW}
      </button>
      <div class="step-body">
        <select aria-label="Destino" id="recDestSel">
          <option value="">Sin elegir</option>
          ${obrasActivas.map(o=>`<option value="obra:${o.codigo}" ${recibiState.obraCodigo===o.codigo?'selected':''}>${escapeHtml(o.nombre)}</option>`).join('')}
          <option value="libre:Operario" ${recibiState.obraLibre==='Operario'?'selected':''}>Operario</option>
          <option value="libre:Otros" ${recibiState.obraLibre==='Otros'?'selected':''}>Otros</option>
        </select>
      </div>
    </div>

    <div class="step" data-step="2" data-state="${s2}">
      <button class="step-top" data-recstepbtn="2">
        <span class="num"><span class="digit">2</span>${ICON_TICK}</span>
        <span class="tx"><h3>Qué se recibe</h3><span class="sum">${tieneDestino?seleccionCount+' de '+lista.length:''}</span></span>${ICON_ARROW}
      </button>
      <div class="step-body">
        ${!tieneDestino ? '<p class="note">Elige antes un destino.</p>' : (lista.length===0 ? '<p class="note">No hay nada pendiente para este destino.</p>' : lista.map(m=>{
          const mat=findMaterial(m.codigoMaterial); const checked = recibiState.seleccion[m.id]!==false;
          return `<label class="check-row"><input type="checkbox" data-recsel="${m.id}" ${checked?'checked':''}><span class="box">${ICON_CHECK}</span><span class="t" style="flex:1"><b>${escapeHtml(mat?mat.descripcion:m.codigoMaterial)}</b></span><span class="muted" style="font-weight:700">${m.cantidad}${mat?' '+escapeHtml(mat.unidad):''}</span></label>`;
        }).join(''))}
      </div>
    </div>

    <div class="step" data-step="3" data-state="${s3}">
      <button class="step-top" data-recstepbtn="3">
        <span class="num"><span class="digit">3</span>${ICON_TICK}</span>
        <span class="tx"><h3>Quién lo recibe</h3><span class="sum"></span></span>${ICON_ARROW}
      </button>
      <div class="step-body">
        <div class="field"><input type="text" id="recNombre" placeholder="Nombre y apellidos" aria-label="Nombre de quien recibe" value="${escapeHtml(recibiState.nombre)}"></div>
        <div class="sign"><canvas id="sigCanvas"></canvas><div class="rule"></div><div class="cap">Firma con el dedo</div></div>
        <button class="btn btn-line btn-sm" style="margin-top:10px" id="clearSigBtn">Borrar y repetir</button>
      </div>
    </div>
  `;
  wireRecEvents(el);
}
function wireRecEvents(el){
  el.querySelectorAll('[data-pendgroup]').forEach(b=>b.addEventListener('click', ()=>{
    const key = b.dataset.pendgroup;
    recibiState.seleccion = {};
    if(key.startsWith('obra:')){ recibiState.obraCodigo=key.slice(5); recibiState.obraLibre=''; }
    else { recibiState.obraCodigo=null; recibiState.obraLibre=key.slice(6); }
    recStep = 2; renderRecibi();
  }));
  el.querySelectorAll('[data-recstepbtn]').forEach(b=>b.addEventListener('click', ()=>{
    const n = Number(b.dataset.recstepbtn); recStep = (recStep===n)?null:n; renderRecibi();
  }));
  const destSel = el.querySelector('#recDestSel');
  if(destSel) destSel.addEventListener('change', e=>{
    const v = e.target.value; recibiState.seleccion = {};
    if(v.startsWith('obra:')){ recibiState.obraCodigo=v.slice(5); recibiState.obraLibre=''; }
    else if(v.startsWith('libre:')){ recibiState.obraCodigo=null; recibiState.obraLibre=v.slice(6); }
    else { recibiState.obraCodigo=null; recibiState.obraLibre=''; }
    recStep = 2; renderRecibi();
  });
  el.querySelectorAll('[data-recsel]').forEach(cb=>cb.addEventListener('change', e=>{
    recibiState.seleccion[e.target.dataset.recsel] = e.target.checked;
  }));
  const nombreInput = el.querySelector('#recNombre');
  if(nombreInput) nombreInput.addEventListener('input', e=> recibiState.nombre = e.target.value);
  const sigCanvas = el.querySelector('#sigCanvas');
  if(sigCanvas) setupSignaturePad(sigCanvas);
  const clearSigBtn = el.querySelector('#clearSigBtn');
  if(clearSigBtn) clearSigBtn.addEventListener('click', ()=>{
    const ctx = currentSigCanvas.getContext('2d');
    ctx.clearRect(0,0,currentSigCanvas.width,currentSigCanvas.height);
    recibiState.firmaVacia = true;
  });
}
function setupSignaturePad(canvas){
  currentSigCanvas = canvas;
  const ctx = canvas.getContext('2d');
  function fit(){
    const r = canvas.getBoundingClientRect(); if(!r.width) return;
    const dpr = window.devicePixelRatio||1;
    canvas.width = r.width*dpr; canvas.height = r.height*dpr;
    ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.lineWidth=2.5; ctx.lineCap='round'; ctx.lineJoin='round';
    ctx.strokeStyle = getComputedStyle(document.body).color;
  }
  fit();
  let drawing=false;
  function pos(e){ const r=canvas.getBoundingClientRect(); return [e.clientX-r.left, e.clientY-r.top]; }
  canvas.addEventListener('pointerdown', e=>{ drawing=true; ctx.beginPath(); ctx.moveTo(...pos(e)); e.preventDefault(); });
  canvas.addEventListener('pointermove', e=>{ if(!drawing) return; ctx.lineTo(...pos(e)); ctx.stroke(); recibiState.firmaVacia=false; e.preventDefault(); });
  window.addEventListener('pointerup', ()=> drawing=false);
}
async function confirmarRecepcion(){
  const tieneDestino = !!(recibiState.obraCodigo || recibiState.obraLibre);
  if(!tieneDestino){ recStep=1; renderRecibi(); badFlashStep('#panel-rec .step[data-step="1"]'); toast('Elige un destino'); return; }
  const pendientes = movimientosActivos().filter(m=>{
    if(m.tipo!=='Salida' || m.recibido) return false;
    if(recibiState.obraCodigo) return m.codigoObra===recibiState.obraCodigo;
    if(recibiState.obraLibre) return !m.codigoObra && m.obraLibre===recibiState.obraLibre;
    return false;
  });
  const seleccionados = pendientes.filter(m=> recibiState.seleccion[m.id]!==false);
  const nombre = (recibiState.nombre||'').trim();
  if(seleccionados.length===0){ recStep=2; renderRecibi(); badFlashStep('#panel-rec .step[data-step="2"]'); toast('Selecciona al menos un material'); return; }
  if(!nombre){ recStep=3; renderRecibi(); badFlashStep('#panel-rec .step[data-step="3"]'); toast('Indica el nombre de quien recibe'); return; }
  if(recibiState.firmaVacia){ recStep=3; renderRecibi(); badFlashStep('#panel-rec .step[data-step="3"]'); toast('Falta la firma'); return; }
  const firmaDataUrl = currentSigCanvas.toDataURL('image/png');
  const fecha = new Date().toISOString();
  seleccionados.forEach(m=>{ m.recibido=true; m.recibidoPor=nombre; m.recibidoFirma=firmaDataUrl; m.recibidoFecha=fecha; touch(m); });
  $('#recSaveBtn').disabled = true;
  const ok = await saveAll();
  $('#recSaveBtn').disabled = false;
  if(ok){
    toast('Recepción confirmada');
    recibiState.obraCodigo=null; recibiState.obraLibre=''; recibiState.seleccion={}; recibiState.nombre=''; recibiState.firmaVacia=true;
    recStep=1;
  }
  renderRecibi();
}
$('#recSaveBtn').addEventListener('click', confirmarRecepcion);

/* ================= HISTORIAL ================= */
function obraLabelHis(m){
  if(m.codigoObra){ const o=findObra(m.codigoObra); return o?o.nombre:m.codigoObra; }
  if(m.obraLibre) return m.obraLibre + (m.obraDetalle?': '+m.obraDetalle:'');
  return '—';
}
function obraEstadoHis(m){ if(!m.codigoObra) return null; const o=findObra(m.codigoObra); return o?o.estado:null; }
function renderHistorial(){
  const el = $('#content-his');
  el.innerHTML = `
    <div class="head"><div class="tx"><h1>Historial</h1></div></div>
    <div class="search" style="margin-bottom:10px">${ICON_SEARCH}<input type="search" id="hisSearch" placeholder="Buscar material, obra, proveedor, nota"></div>

    </div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px" id="hisPills"></div>
    <div id="hisList"></div>

  const searchInput=$('#hisSearch'), estadoSel=$('#hisEstado'), obraSel=$('#hisObraSel');
  searchInput.addEventListener('input', ()=>{ hisPage=1; drawHistorial(); });
  estadoSel.addEventListener('change', ()=>{ hisPage=1; drawHistorial(); });
  obraSel.addEventListener('change', ()=>{ hisQuickObra=null; hisPage=1; drawHistorial(); });
  drawHistorial();

  function drawHistorial(){
    const fq=(searchInput.value||'').trim().toLowerCase(), fe=estadoSel.value, foSel=obraSel.value;
    const obraActiva = hisQuickObra || foSel || '';
    const tipoActivo = hisQuickTipo || '';
    let list = movimientosActivos().filter(m=> (!obraActiva||m.codigoObra===obraActiva) && (!tipoActivo||m.tipo===tipoActivo));
    if(fe==='activas') list = list.filter(m=> obraEstadoHis(m)!=='Cerrada');
    else if(fe==='cerradas') list = list.filter(m=> obraEstadoHis(m)==='Cerrada');
    if(hisQuickFecha) list = list.filter(m=> new Date(m.fecha).toDateString()===hisQuickFecha);
    if(fq){
      list = list.filter(m=>{
        const mat=findMaterial(m.codigoMaterial), resp=m.responsableCodigo?findResponsable(m.responsableCodigo):null;
        const campos=[mat?mat.descripcion:'', mat?mat.proveedor:'', mat?mat.codigoProveedor:'', mat?mat.codigoPropio:'', obraLabelHis(m), resp?resp.nombre:'', m.nota||''];
        return campos.some(v=>(v||'').toLowerCase().includes(fq));
      });
    }
    list.sort((a,b)=> new Date(b.fecha)-new Date(a.fecha));
    window.__hisUltimaLista = list;

    const pills=[];
    if(hisQuickFecha) pills.push(`<span class="pill">${new Date(hisQuickFecha).toLocaleDateString('es-ES')} <button data-clrfecha>✕</button></span>`);
    if(obraActiva){ const o=findObra(obraActiva); pills.push(`<span class="pill">${escapeHtml(o?o.nombre:obraActiva)} <button data-clrobra>✕</button></span>`); }
    if(tipoActivo) pills.push(`<span class="pill">${tipoActivo} <button data-clrtipo>✕</button></span>`);
    let pillsHtml = pills.join('');
    if(obraActiva && findObra(obraActiva)) pillsHtml += `<button class="btn btn-line btn-sm" id="hisVerResumen" data-obra="${obraActiva}">Ver resumen</button>`;
    pillsHtml += `<span style="flex:1"></span><button class="btn btn-line btn-sm" id="hisExportCsv">Exportar CSV</button>`;
    $('#hisPills').innerHTML = pillsHtml;
    const clrf=$('[data-clrfecha]'); if(clrf) clrf.onclick=()=>{ hisQuickFecha=null; hisPage=1; drawHistorial(); };
    const clro=$('[data-clrobra]'); if(clro) clro.onclick=()=>{ hisQuickObra=null; obraSel.value=''; hisPage=1; drawHistorial(); };
    const clrt=$('[data-clrtipo]'); if(clrt) clrt.onclick=()=>{ hisQuickTipo=null; hisPage=1; drawHistorial(); };
    const verR=$('#hisVerResumen'); if(verR) verR.onclick=()=>openResumenModal(findObra(verR.dataset.obra));
    $('#hisExportCsv').onclick = exportHistorialCsv;

    if(!list.length){ $('#hisList').innerHTML = '<p class="empty">No hay movimientos con estos filtros.</p>'; return; }

    // agrupar en tarjetas (mismo grupoId = mismo guardado) preservando el orden
    const gruposFlat = [];
    { const gm={};
      list.forEach(m=>{
        const key=m.grupoId||m.id;
        if(!gm[key]){ const g={key, dia:fmtDateOnly(m.fecha), movs:[m]}; gm[key]=g; gruposFlat.push(g); }
        else gm[key].movs.push(m);
      });
    }
    const totalPages = Math.max(1, Math.ceil(gruposFlat.length/PER_PAGE));
    hisPage = Math.min(Math.max(1,hisPage), totalPages);
    const pageGrupos = gruposFlat.slice((hisPage-1)*PER_PAGE, hisPage*PER_PAGE);

    let html='', diaAnterior=null;

      const hora = new Date(m0.fecha).toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'});

      html += `<div class="card">
        <div class="card-head">

          <span class="sp"></span><span class="muted" style="font-size:13.5px;font-weight:600">${hora}</span>
          <span class="tag">${grupo.length} art.</span>${todosRecibidos?'<span class="tag in">Recibido</span>':''}
        </div>
        ${grupo.map(m=>{
          const mat=findMaterial(m.codigoMaterial);
          return `<div class="row"><div class="t"><b>${escapeHtml(mat?mat.descripcion:m.codigoMaterial)}</b><small>${mat&&mat.codigoProveedor?escapeHtml(mat.codigoProveedor):''}</small></div>

        <details class="more"><summary>Más info</summary>

          ${todosRecibidos?`<dt>Recibido</dt><dd>${escapeHtml(m0.recibidoPor||'')} · ${fmtDate(m0.recibidoFecha)}</dd>`:''}</dl>
        </details>
      </div>`;
    });
    html += pagerHtml(hisPage, totalPages, 'his');
    $('#hisList').innerHTML = html;
    $$('[data-editmov]').forEach(b=>b.addEventListener('click', ()=>{ const mov=state.movimientos.find(x=>x.id===b.dataset.editmov); if(mov) openEditMovModal(mov); }));
    $$('[data-filtertipo]').forEach(b=>b.addEventListener('click', ()=>{ hisQuickTipo=b.dataset.filtertipo; hisPage=1; drawHistorial(); }));
    $$('[data-filterobra]').forEach(b=>b.addEventListener('click', ()=>{ hisQuickObra=b.dataset.filterobra; hisPage=1; drawHistorial(); }));
    const hisPrev=$('#hisPrev'), hisNext=$('#hisNext');
    if(hisPrev) hisPrev.addEventListener('click', ()=>{ hisPage--; drawHistorial(); });
    if(hisNext) hisNext.addEventListener('click', ()=>{ hisPage++; drawHistorial(); });
  }
}
function exportHistorialCsv(){
  const list = window.__hisUltimaLista || [];
  if(!list.length){ toast('No hay movimientos que exportar'); return; }
  const cab=['Tipo','Fecha','Obra','Material','Cantidad','Codigo proveedor','Codigo propio','Proveedor','Responsable','Recibido por','Nota'];
  const filas = list.map(m=>{
    const mat=findMaterial(m.codigoMaterial), resp=m.responsableCodigo?findResponsable(m.responsableCodigo):null;
    return [m.tipo, fmtDate(m.fecha), obraLabelHis(m), mat?mat.descripcion:m.codigoMaterial, m.cantidad,
      mat&&mat.codigoProveedor?mat.codigoProveedor:'', mat&&mat.codigoPropio?mat.codigoPropio:'', mat&&mat.proveedor?mat.proveedor:'',
      resp?resp.nombre:'', m.recibidoPor||'', m.nota||''];
  });
  function csvCell(v){ v=String(v==null?'':v); return /[",;\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; }
  const csv = [cab, ...filas].map(f=>f.map(csvCell).join(';')).join('\r\n');
  const blob = new Blob(['\uFEFF'+csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href=url; a.download='historial_'+new Date().toISOString().slice(0,10)+'.csv';
  document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
  toast('CSV descargado');
}

let matCatPage = 1;
function renderMaterialesTab(el){
  el.innerHTML = `
    <div class="two" style="margin-bottom:10px">
      <div class="search" style="margin-bottom:0">${ICON_SEARCH}<input type="search" id="matCatSearch" placeholder="Buscar material"></div>

  const grupoSel = el.querySelector('#matCatGrupo');
  searchInput.addEventListener('input', ()=>{ matCatPage=1; draw(); });
  grupoSel.addEventListener('change', ()=>{ matCatPage=1; draw(); });
  draw();
  function draw(){
    const q=(searchInput.value||'').trim().toLowerCase();
    const grupo = grupoSel.value;
    let list = state.materiales.filter(m=>!m.eliminado);
    if(grupo) list = list.filter(m=> (m.grupo||'Otros')===grupo);

    list.sort((a,b)=>a.descripcion.localeCompare(b.descripcion));
    const totalPages = Math.max(1, Math.ceil(list.length/PER_PAGE));
    matCatPage = Math.min(Math.max(1,matCatPage), totalPages);
    const pageList = list.slice((matCatPage-1)*PER_PAGE, matCatPage*PER_PAGE);
    $('#matCatList').innerHTML = (list.length ? `<div class="card">` + pageList.map(m=>{
      const foto = materialFoto(m);
      const provTxt = [m.proveedor, m.codigoProveedor?`<span class="code-copy" data-copy="${escapeHtml(m.codigoProveedor)}">${escapeHtml(m.codigoProveedor)}</span>`:null].filter(Boolean).join(' · ');

    $$('[data-addmov]').forEach(b=>b.addEventListener('click', ()=>{
      addMaterialALineas(b.dataset.addmov);
      const mat = findMaterial(b.dataset.addmov);
      toast('Añadido al movimiento: '+(mat?mat.descripcion:''));

function qrImageUrl(text, size){
  size = size || 240;
  return 'https://api.qrserver.com/v1/create-qr-code/?size='+size+'x'+size+'&data='+encodeURIComponent(text);
}
function openEtiquetaModal(material){
  if(!material) return;
  if(!material.codigoPropio){
    toast('Completa el código propio antes de generar la etiqueta');
    openMaterialModal(material);
    return;
  }
  const qrTexto = [
    material.codigoPropio,
    material.proveedor ? 'Proveedor: '+material.proveedor : null,
    material.codigoProveedor ? 'Cód. proveedor: '+material.codigoProveedor : null,
    'Concepto: '+material.descripcion
  ].filter(Boolean).join('\n');
  const labelHtml = `
    <div class="label-sheet">
      <img class="qr" src="${qrImageUrl(qrTexto)}" width="118" height="118" alt="Código QR del material" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'qr',textContent:'${escapeHtml(material.codigoPropio)}'}))">
      <div class="meta"><b>${escapeHtml(material.descripcion)}</b><small>${[material.proveedor,material.codigoProveedor].filter(Boolean).map(escapeHtml).join(' · ')}</small><div class="code">${escapeHtml(material.codigoPropio)}</div></div>
    </div>
    <p class="note">El QR incluye proveedor, código de proveedor, código propio y concepto.</p>
  `;
  $('#mEtiquetaBody').innerHTML = labelHtml;
  $('#mEtiquetaPrint').onclick = ()=>{
    $('#printArea').innerHTML = labelHtml;
    setTimeout(()=>window.print(), 150);
  };
  openModal('mEtiqueta');
}
function openResumenModal(obra){
  if(!obra) return;
  $('#mResumenTitle').textContent = obra.nombre;
  const mapa = {};
  movimientosActivos().forEach(m=>{
    if(m.codigoObra !== obra.codigo) return;
    if(!mapa[m.codigoMaterial]) mapa[m.codigoMaterial] = {salida:0, entrada:0};
    if(m.tipo==='Salida') mapa[m.codigoMaterial].salida += Number(m.cantidad)||0; else mapa[m.codigoMaterial].entrada += Number(m.cantidad)||0;
  });
  const filas = Object.keys(mapa).map(codigo=>{
    const mat=findMaterial(codigo), {salida,entrada}=mapa[codigo];
    return { nombre: mat?mat.descripcion:codigo, unidad: mat?mat.unidad:'', neto: salida-entrada };
  }).sort((a,b)=>b.neto-a.neto);
  const maxNeto = Math.max(1, ...filas.map(f=>Math.abs(f.neto)));
  const body = $('#mResumenBody');
  body.innerHTML = `
    <p class="note" style="margin:0 0 14px">Total llevado a esta obra, descontando lo que ha vuelto.</p>
    ${filas.length ? filas.map(f=>`<div class="total-row"><div class="t"><b style="font-size:15.5px">${escapeHtml(f.nombre)}</b><div class="bar"><i style="width:${Math.max(4,Math.round(Math.abs(f.neto)/maxNeto*100))}%"></i></div></div><b>${f.neto} ${escapeHtml(f.unidad)}</b></div>`).join('') : `<p class="empty">Todavía no hay movimientos para esta obra.</p>`}
  `;
  $('#mResumenPrint').onclick = ()=>{ $('#printArea').innerHTML = `<h2>${escapeHtml(obra.nombre)}</h2>` + body.innerHTML; setTimeout(()=>window.print(), 150); };
  openModal('mResumen');
}

    ${currentUsuario ? `<div class="card"><p class="note" style="margin:0">Conectado como <b style="color:var(--ink)">${escapeHtml(currentUsuario.nombre)}</b></p></div>` : ''}
    <button class="btn btn-ink btn-block" style="margin-bottom:12px" id="addRespBtn">Añadir responsable</button>
    <div id="respCfgList"></div>
    <p class="sec">Apariencia</p>
    <div class="field"><label for="themeSel">Tema</label><select id="themeSel"><option value="auto">Automático</option><option value="light">Claro</option><option value="dark">Oscuro</option></select></div>
    <p class="sec">Notificaciones</p>
    <button class="btn btn-line btn-block" id="notifBtn" ${notifGranted?'disabled':''}>${!notifSupported?'No disponibles en este navegador':(notifGranted?'Notificaciones activadas ✓':'Activar notificaciones del navegador')}</button>
    <p class="note">Además del aviso dentro de la app, esto te avisa aunque tengas otra pestaña abierta.</p>
    <p class="sec">Sesión</p>
    <button class="btn btn-line btn-block" id="cerrarSesionBtn">Cerrar sesión</button>
    <p class="sec">Sugerencias</p>
    <div class="card">
      <p class="note" style="margin:0 0 10px">¿Se te ocurre algo que mejorar en la app? Escríbelo aquí.</p>
      <div class="field"><textarea id="sugText" rows="3" placeholder="Escribe tu sugerencia..." style="min-height:80px;resize:vertical;"></textarea></div>
      <button class="btn btn-ink btn-block" id="sugSendBtn">Enviar sugerencia</button>
    </div>
    <div id="sugList"></div>
  `;
  el.querySelector('#addRespBtn').addEventListener('click', ()=> openResponsableModal(null));
  const list = state.responsables.filter(r=>!r.eliminado).sort((a,b)=>a.nombre.localeCompare(b.nombre));
  $('#respCfgList').innerHTML = list.length ? `<div class="card">` + list.map(r=>`
    <div class="cat-row"><div class="t"><b>${escapeHtml(r.nombre)}</b></div>
      <div class="acts">
        <button class="icon-btn" data-edit="${r.codigo}" aria-label="Editar">${ICON_EDIT}</button>
        <button class="icon-btn" data-del="${r.codigo}" aria-label="Borrar">${ICON_TRASH}</button>
      </div></div>`).join('') + `</div>` : `<p class="empty">Aún no hay responsables dados de alta.</p>`;
  $$('[data-edit]').forEach(b=>b.addEventListener('click', ()=>openResponsableModal(findResponsable(b.dataset.edit))));
  $$('[data-del]').forEach(b=>b.addEventListener('click', async ()=>{
    if(confirm('¿Eliminar este responsable?')){
      const resp=findResponsable(b.dataset.del); if(resp){ resp.eliminado=true; touch(resp); }
      const ok = await saveAll(); if(ok) toast('Responsable eliminado'); renderConfig();
    }
  }));
  const themeSel = $('#themeSel'); themeSel.value = currentTheme;
  themeSel.addEventListener('change', e=> applyTheme(e.target.value));
  const notifBtn = $('#notifBtn');
  if(notifBtn && notifSupported && !notifGranted) notifBtn.addEventListener('click', async ()=>{
    const perm = await Notification.requestPermission();
    if(perm==='granted'){ toast('Notificaciones activadas'); } else { toast('No se activaron los avisos'); }
    renderConfig();
  });
  $('#cerrarSesionBtn').addEventListener('click', ()=>{
    if(confirm('¿Cerrar sesión? Tendrás que volver a introducir el PIN.')){
      clearStoredUnlock();
      location.reload();
    }
  });
  $('#sugSendBtn').addEventListener('click', async ()=>{
    const texto = $('#sugText').value.trim();
    if(!texto){ toast('Escribe algo antes de enviar'); return; }
    const btn = $('#sugSendBtn'); btn.disabled = true;
    const ahora = Date.now();
    state.sugerencias.push({
      id: 'S'+ahora+'_'+Math.floor(Math.random()*10000),
      texto,
      autor: currentUsuario ? currentUsuario.nombre : 'Anónimo',
      fecha: new Date().toISOString(),
      actualizadoEn: ahora
    });
    const ok = await saveAll(); btn.disabled = false;
    if(ok){ toast('Sugerencia enviada, ¡gracias!'); }
    renderConfig();
  });
  drawSugerencias();
}
function drawSugerencias(){
  const list = state.sugerencias.filter(s=>!s.eliminado).sort((a,b)=> new Date(b.fecha)-new Date(a.fecha));
  $('#sugList').innerHTML = list.length ? `<div class="card">` + list.map(s=>`
    <div class="cat-row" style="align-items:flex-start;">
      <div class="t"><b style="font-weight:600;font-size:14.5px;">${escapeHtml(s.texto)}</b><small>${escapeHtml(s.autor||'Anónimo')} · ${fmtDate(s.fecha)}</small></div>
      <div class="acts"><button class="icon-btn" data-delsug="${s.id}" aria-label="Borrar">${ICON_TRASH}</button></div>
    </div>`).join('') + `</div>` : '';
  $$('[data-delsug]').forEach(b=>b.addEventListener('click', async ()=>{
    if(confirm('¿Eliminar esta sugerencia?')){
      const sug = state.sugerencias.find(s=>s.id===b.dataset.delsug);
      if(sug){ sug.eliminado = true; touch(sug); }
      const ok = await saveAll();
      if(ok) toast('Sugerencia eliminada');
      drawSugerencias();
    }
  }));
}
function openResponsableModal(existing){
  const isEdit = !!existing;
  $('#mRespTitle').textContent = isEdit?'Editar responsable':'Nuevo responsable';
  const body = $('#mRespBody');
  body.innerHTML = `
    <div class="field"><label for="rNom">Nombre</label><input id="rNom" type="text" value="${escapeHtml(existing?.nombre||'')}" placeholder="Nombre y apellidos"></div>
    <div class="field"><label for="rPin">PIN de acceso (4 dígitos, opcional)</label><input id="rPin" type="text" inputmode="numeric" maxlength="4" value="${escapeHtml(existing?.pin||'')}" placeholder="Ej. 4821"></div>
    <p class="note">Si le pones un PIN, esta persona podrá entrar a la app con su propio código, y quedará como responsable por defecto en sus movimientos.</p>
  `;
  $('#mRespSave').onclick = async ()=>{
    const nombre = body.querySelector('#rNom').value.trim();
    const pin = body.querySelector('#rPin').value.trim();
    if(!nombre){ toast('El nombre es obligatorio'); return; }
    if(pin && !/^\d{4}$/.test(pin)){ toast('El PIN debe tener 4 dígitos'); return; }
    if(pin && (pin===ACCESS_CODE || state.responsables.some(r=>!r.eliminado && r.pin===pin && r!==existing))){ toast('Ese PIN ya lo usa otra persona'); return; }
    const btn=$('#mRespSave'); btn.disabled=true;
    if(isEdit){ touch(Object.assign(existing, {nombre, pin})); }
    else{ const codigo=nextCodigo('RESP', state.responsables); state.responsables.push(touch({codigo, nombre, pin, ejemplo:false})); }
    const ok = await saveAll(); btn.disabled=false; closeModals();
    if(ok){ toast('Responsable guardado'); renderConfig(); }
  };
  openModal('mResp');
}

/* ================= BLOQUEO Y SESIÓN ================= */
const ACCESS_CODE = '1234';
const UNLOCK_KEY = 'almacen_unlocked_until';
const UNLOCK_USER_KEY = 'almacen_unlocked_user';
const UNLOCK_HOURS = 12;
let lockCode = '';
let currentUsuario = null;
let dataReadyPromise = jsonbinConfigured() ? loadAll() : Promise.resolve();

function checkStoredUnlock(){
  try{
    const until = parseInt(localStorage.getItem(UNLOCK_KEY)||'0', 10);
    if(until && Date.now() < until) return { ok:true, userCodigo: localStorage.getItem(UNLOCK_USER_KEY) || null };
  }catch(e){}
  return { ok:false };
}
function persistUnlock(userCodigo){
  try{
    localStorage.setItem(UNLOCK_KEY, String(Date.now() + UNLOCK_HOURS*3600*1000));
    localStorage.setItem(UNLOCK_USER_KEY, userCodigo || '');
  }catch(e){}
}
function clearStoredUnlock(){
  try{ localStorage.removeItem(UNLOCK_KEY); localStorage.removeItem(UNLOCK_USER_KEY); }catch(e){}
}

function setupLock(){
  const dots = $$('#dots i');
  $$('#pad button').forEach(b=>b.addEventListener('click', async ()=>{
    if(b.dataset.act==='clr'){ lockCode = lockCode.slice(0,-1); }
    else if(b.dataset.d!==undefined && lockCode.length<4){ lockCode += b.dataset.d; }
    dots.forEach((d,i)=>d.classList.toggle('on', i<lockCode.length));
    if(lockCode.length===4){
      const code = lockCode;
      await dataReadyPromise;
      const matchUser = state.responsables.find(r=>!r.eliminado && r.pin && r.pin===code);
      if(code===ACCESS_CODE || matchUser){
        persistUnlock(matchUser?matchUser.codigo:null);
        setTimeout(()=> unlockApp(matchUser||null), 220);
      } else {
        $('#dots').classList.add('err');
        setTimeout(()=>{ $('#dots').classList.remove('err'); lockCode=''; dots.forEach(d=>d.classList.remove('on')); }, 420);
      }
    }
  }));
}
function unlockApp(usuario){
  $('#lock').style.display='none';
  document.body.classList.remove('locked');
  currentUsuario = usuario || null;
  if(currentUsuario) formState.responsableCodigo = currentUsuario.codigo;
  startAppAfterUnlock();
}

/* ================= ACTUALIZACIÓN AUTOMÁTICA Y AVISOS ================= */
let lastKnownMovIds = new Set();
function startAutoRefresh(){
  lastKnownMovIds = new Set(movimientosActivos().map(m=>m.id));
  setInterval(async ()=>{
    if(document.visibilityState!=='visible' || scanning || $$('.scrim.on').length) return;
    await loadAll();
    const nuevos = movimientosActivos().filter(m=> !lastKnownMovIds.has(m.id));
    lastKnownMovIds = new Set(movimientosActivos().map(m=>m.id));
    if(nuevos.length) notifyNuevosMovimientos(nuevos);
    renderCurrentPanel();
  }, 45000);
}
function notifyNuevosMovimientos(nuevos){
  const primero = nuevos[0];
  const mat = findMaterial(primero.codigoMaterial);
  const texto = nuevos.length===1 ? `${primero.tipo}: ${mat?mat.descripcion:primero.codigoMaterial}` : `${nuevos.length} movimientos nuevos`;
  toast('Nuevo · '+texto);
  if('Notification' in window && Notification.permission==='granted'){
    try{ new Notification('Control de Almacén', { body: texto }); }catch(e){}
  }
}

/* ================= ARRANQUE ================= */
async function startAppAfterUnlock(){
  if(!jsonbinConfigured()){
    $('#content-ini').innerHTML = `<div class="head"><div class="tx"><h1>Inicio</h1></div></div>
      <div class="card"><h3 style="margin-bottom:10px">Falta configurar el almacenamiento</h3>
      <p class="note">Abre el archivo HTML, busca JSONBIN_API_KEY y JSONBIN_BIN_ID cerca del principio del script y rellénalos con tus datos de jsonbin.io. Luego vuelve a subir el archivo.</p></div>`;
    return;
  }
  await dataReadyPromise;
  applyTheme('auto');
  renderInicio();
  startAutoRefresh();
}

(async function init(){
  const stored = checkStoredUnlock();
  if(stored.ok){
    await dataReadyPromise;
    unlockApp(stored.userCodigo ? findResponsable(stored.userCodigo) : null);
  } else {
    setupLock();
  }
})();
</script>
